apiVersion: tclaude.dev/v1alpha1
kind: ProcessTemplate
id: build-review-ship
name: Build → review → ship
description: >-
  A developer builds the task and opens a PR, a reviewer who did not build it
  approves or sends it back, and the group's lead ships it.
params:
  task:
    type: string
    required: true
# The group's lead oversees a run; a step stuck longer than its patience
# (an hour, two for building) raises a concern to it.
overseer: lead
patience: 1h
start: start
nodes:
  start:
    type: start
    next: { next: build }

  # A developer builds it and opens a PR.
  build:
    name: Build it
    type: task
    captures: [pr]
    patience: 2h
    performer:
      kind: agent
      role: dev
      fallback: { action: spawn }
      prompt: "Build this: {{ params.task }}\nOpen a PR and report its link as pr."
    next: { next: review }

  # A reviewer who did not build it.
  review:
    name: Review
    type: decision
    performer:
      kind: agent
      role: reviewer
      differentFrom: [build]
      fallback: { action: spawn }
      prompt: "Review the PR for this task: {{ params.task }}\nThe PR:\n{{ outputs.pr }}\nChoose approve, or changes with what to change."
    next: { approve: ship, changes: build, escalate: escalated }
    loops:
      changes: { maxIterations: 3, onExhausted: escalate }

  # The group's lead ships it.
  ship:
    name: Ship
    type: task
    performer:
      kind: agent
      lead: true
      prompt: "The review approved this PR. Merge and ship it:\n{{ outputs.pr }}"
    next: { next: done }

  done:
    name: Done
    type: end
    result: success
  # Out of rounds, or escalated by hand: the run fails, so a board task it
  # runs for is blocked with the reason rather than left as it was.
  escalated:
    name: Escalated
    type: end
    result: failed
