version: "2"

run:
  timeout: 5m

linters:
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      # errcheck (golangci-lint v2.15+) flags a bare receive from an error
      # channel. Waiting on such a channel with `<-done` or `case <-errs:`
      # is a deliberate wait that discards the value, and staticcheck S1005
      # rejects the `_ = <-ch` spelling that would satisfy errcheck. Only a
      # line holding nothing but the receive matches; a receive used as a
      # call argument is still checked.
      - linters:
          - errcheck
        source: '^\s*(case\s+)?<-[\w.]+\s*:?\s*(//.*)?$'
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (*os.File).Close
        - (*database/sql.Rows).Close
        - (io.ReadCloser).Close
        - (net.Listener).Close
        - (net.Conn).Close

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
