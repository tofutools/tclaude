version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: tclaude-no-cgo
    main: .
    binary: tclaude
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: tclaude-darwin
    main: .
    binary: tclaude
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
  - id: tclaude-agentd-no-cgo
    main: ./cmd/tclaude-agentd
    binary: tclaude-agentd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: tclaude-agentd-darwin
    main: ./cmd/tclaude-agentd
    binary: tclaude-agentd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
