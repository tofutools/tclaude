version: 2

before:
  hooks:
    - go mod tidy

builds:
  # Linux: pure Go, no cgo. fyne.io/systray uses D-Bus
  # (StatusNotifierItem), so the tray icon works without a C toolchain.
  - id: tclaude-no-cgo
    main: .
    binary: tclaude
    ldflags: &release_ldflags
      - -s -w -X main.version={{ .Env.TCLAUDE_RELEASE_VERSION }} -X github.com/tofutools/tclaude/pkg/common/buildversion.InstallMethod={{ .Env.TCLAUDE_INSTALL_METHOD }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  # macOS: fyne.io/systray binds Cocoa via cgo, so darwin builds
  # need CGO_ENABLED=1. CI runs darwin builds on a macos-latest
  # runner where xcrun's clang is available, so the native build
  # links cleanly. amd64 is intentionally skipped (Apple Silicon
  # only).
  - id: tclaude-darwin
    main: .
    binary: tclaude
    ldflags: *release_ldflags
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
  # The standalone agent-coordination daemon: `tclaude-agentd serve` is the
  # same code as `tclaude agentd serve`, shipped as its own binary so a host
  # can run the daemon without the rest of the CLI. It links the same systray
  # backend as tclaude, so the cgo split above applies unchanged.
  - id: tclaude-agentd-no-cgo
    main: ./cmd/tclaude-agentd
    binary: tclaude-agentd
    ldflags: *release_ldflags
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: tclaude-agentd-darwin
    main: ./cmd/tclaude-agentd
    binary: tclaude-agentd
    ldflags: *release_ldflags
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64

  # The federation relay (docs/federation.md). Pure Go with no systray, so
  # every platform builds without cgo.
  - id: tclaude-hub
    main: ./cmd/tclaude-hub
    binary: tclaude-hub
    ldflags: *release_ldflags
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
