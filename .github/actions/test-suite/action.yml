# Shared test-suite runner for PR CI and both release workflows, all using
# the same shard split. The partition lives here and nowhere else, so the
# flows cannot drift apart, and future re-splits (e.g. dividing agentd)
# apply to every flow at once. `shard: all` remains available as the literal
# `go test ./...` a contributor runs locally.
#
# Callers must check out the repo before using this action (a local action
# cannot be resolved earlier); Go and Node toolchains are set up here.
name: Run test suite
description: Set up Go + Node and run the Go test suite, whole or as one shard.

inputs:
  shard:
    description: >-
      Which slice to run: all | agentd | jstest | process | sandbox | rest.
      The named shards isolate the measured heavyweights (agentd's ~2.5min
      serial binary, jstest's 124 Node suites, the process tree's CPU-bound
      packages) and the sandbox packages that modify their environment;
      `rest` is derived by subtracting the named shards' own `go list` output
      from the full package list, so the partition is exact by construction
      and a removed/renamed shard target fails loudly.
    default: all
  race:
    description: Set to 'true' to run with -race (roughly triples wall time).
    default: 'false'
  diff-base:
    description: >-
      Git revision to grade the shard against. When set, the shard runs only
      the packages a change since that revision can actually reach, computed
      from the real import graph by scripts/ci/affected; when empty (the
      default) the whole shard runs, which is what the release flows want.
      PR CI passes HEAD^1 — the base commit of the merge ref actions/checkout
      builds — so the job needs fetch-depth >= 2 to have that parent.
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # The dashboard's JS is unit-tested with Node's built-in test runner.
    # Only `all`, `agentd` (process_graph_node_test.go), and `jstest` need it;
    # installing Node in the Go-only shards adds a network-dependent setup
    # failure before their tests can even start. Use an exact hosted-toolcache
    # version so setup-node does not need to resolve the floating `lts/*`
    # manifest on every shard.
    - name: Set up Node.js
      if: inputs.shard == 'all' || inputs.shard == 'agentd' || inputs.shard == 'jstest'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.20.0

    # Package-level parallelism is left at the go test default (GOMAXPROCS):
    # go test buffers each package's output and prints it atomically, and
    # every test runs against its own tempdir HOME, so neither legibility nor
    # contention argues for a cap. (-parallel is left at its default too; the
    # few packages using t.Parallel() are fine with it.)
    #
    # TCLAUDE_NODE_TEST_CACHE_KEY makes the external Node runtime part of
    # jstest's Go test-cache key without disabling useful result caching for
    # every other package.
    - name: Run tests (${{ inputs.shard }})
      shell: bash
      env:
        DIFF_BASE: ${{ inputs.diff-base }}
      run: |
        case "${{ inputs.shard }}" in
          all|agentd|jstest)
            export TCLAUDE_NODE_TEST_CACHE_KEY="$(node -p 'process.execPath + ":" + process.version')"
            ;;
        esac
        case "${{ inputs.shard }}" in
          all) pkgs="./..." ;;
          agentd)  pkgs="./pkg/claude/agentd" ;;
          jstest)
            pkgs="./pkg/claude/agentd/jstest"
            # This shard owns its runner, so let Node use every core; the
            # in-test default (NumCPU-2, sized for sharing a runner with the
            # Go packages) would leave the 3-core macOS runner near-serial.
            # Assign before export: `export VAR=$(cmd)` discards cmd's exit
            # status, and a silently empty value would fall back to the
            # near-serial default — the regression this variable prevents.
            cores="$(getconf _NPROCESSORS_ONLN)"
            export TCLAUDE_JS_TEST_CONCURRENCY="$cores"
            ;;
          process) pkgs="./pkg/claude/process/..." ;;
          sandbox)
            pkgs="./pkg/claude/session/... ./pkg/claude/common/sandboxpolicy/... ./pkg/claude/sandboxassumptions/..."
            ;;
          rest)
            # Everything the named shards don't cover, derived by literally
            # subtracting the named shards' `go list` output from the full
            # package list — the partition cannot drift from the shard
            # definitions, and a removed/renamed shard target fails here
            # loudly instead of silently dropping packages.
            all_pkgs="$(go list ./...)"
            sharded_pkgs="$(go list ./pkg/claude/agentd ./pkg/claude/agentd/jstest ./pkg/claude/process/... ./pkg/claude/session/... ./pkg/claude/common/sandboxpolicy/... ./pkg/claude/sandboxassumptions/...)"
            pkgs="$(comm -23 \
              <(printf '%s\n' "$all_pkgs" | sort) \
              <(printf '%s\n' "$sharded_pkgs" | sort))"
            ;;
          *) echo "unknown shard: ${{ inputs.shard }}" >&2; exit 1 ;;
        esac
        race=""
        if [ "${{ inputs.race }}" = "true" ]; then race="-race"; fi

        # Package selection. The selector is conservative by construction: a
        # changed file it cannot attribute to a package (go.mod, a doc a test
        # reads, a workflow, its own source) degrades to the full shard, and
        # it prints the reason for whichever verdict it reached. Only the PR
        # flow passes a base; release and manual-release always run in full,
        # so anything a wrong skip could hide is still measured before a
        # release, on the merge commit itself.
        if [ -n "$DIFF_BASE" ]; then
          selected="$(go run ./scripts/ci/affected -base "$DIFF_BASE" $pkgs)"
          if [ -z "$selected" ]; then
            echo "No package in this shard can be reached by the change; nothing to test."
            exit 0
          fi
          pkgs="$selected"
        fi

        go test $race $pkgs
