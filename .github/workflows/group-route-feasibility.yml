name: Group-route feasibility

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/group-route-feasibility.yml
      - scripts/group-route-feasibility/**
      - docs/group-route-feasibility.md
      - docs/group-routes.md
      - pkg/claude/agentd/**
      - pkg/claude/common/db/**
      - pkg/claude/routeadapter/**
      - pkg/claude/session/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: group-route-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux namespace relay feasibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Assert checked-out requested commit
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          printf 'requested head: %s\nchecked-out HEAD: %s\n' "$EXPECTED_HEAD" "$actual_head"
          test "$actual_head" = "$EXPECTED_HEAD"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Unlock and verify user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --die-with-parent --unshare-all --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp -- true

      - name: Run Linux evidence probe
        shell: bash
        run: |
          set -o pipefail
          scripts/group-route-feasibility/run.sh 2>&1 | tee "$RUNNER_TEMP/group-route-feasibility-linux.log"

      - name: Run exact-head Linux production route activation smoke
        shell: bash
        env:
          TCLAUDE_LINUX_ROUTE_CAPABILITY_SMOKE: "1"
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          go test ./pkg/claude/agentd \
            -run '^TestLinuxRouteCapabilityIntegratedSmoke$' -count=1 -timeout 600s -v \
            2>&1 | tee "$RUNNER_TEMP/tcl-952-linux-route-smoke.log"
          grep -q -- '--- PASS: TestLinuxRouteCapabilityIntegratedSmoke' "$RUNNER_TEMP/tcl-952-linux-route-smoke.log"
          grep -q 'TCL-952 Linux exact checked-out head:' "$RUNNER_TEMP/tcl-952-linux-route-smoke.log"
          grep -q 'policy-floor:host-and-internet-denied' "$RUNNER_TEMP/tcl-952-linux-route-smoke.log"
          grep -q 'TCL-952 Linux publisher stage evidence:' "$RUNNER_TEMP/tcl-952-linux-route-smoke.log"
          grep -q 'TCL-952 Linux consumer stage evidence:' "$RUNNER_TEMP/tcl-952-linux-route-smoke.log"
          grep -q 'TCL-952 Linux negative evidence:' "$RUNNER_TEMP/tcl-952-linux-route-smoke.log"
          grep -q 'TCL-952 Linux sustained route evidence:' "$RUNNER_TEMP/tcl-952-linux-route-smoke.log"
          grep -q 'TCL-952 Linux publisher-exit evidence:' "$RUNNER_TEMP/tcl-952-linux-route-smoke.log"
          grep -q 'TCL-952 Linux evidence: POSITIVE' "$RUNNER_TEMP/tcl-952-linux-route-smoke.log"

      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group-route-feasibility-linux
          path: |
            ${{ runner.temp }}/group-route-feasibility-linux.log
            ${{ runner.temp }}/tcl-952-linux-route-smoke.log

  darwin:
    name: Darwin Seatbelt port-pool feasibility
    runs-on: macos-latest
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Assert checked-out requested commit
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          printf 'requested head: %s\nchecked-out HEAD: %s\n' "$EXPECTED_HEAD" "$actual_head"
          test "$actual_head" = "$EXPECTED_HEAD"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install tmux for the production launch cell
        run: |
          brew install tmux
          tmux -V

      - name: Run Darwin evidence probe
        shell: bash
        run: |
          set -o pipefail
          scripts/group-route-feasibility/run.sh 2>&1 | tee "$RUNNER_TEMP/group-route-feasibility-darwin.log"

      - name: Run TCL-951 exact-head production route smoke
        shell: bash
        env:
          TCLAUDE_DARWIN_ROUTE_CAPABILITY_SMOKE: "1"
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          go test ./pkg/claude/agentd \
            -run '^TestDarwinRouteCapabilityIntegratedSmoke$' -count=1 -timeout 600s -v \
            2>&1 | tee "$RUNNER_TEMP/tcl-951-darwin-route-smoke.log"
          grep -q -- '--- PASS: TestDarwinRouteCapabilityIntegratedSmoke' "$RUNNER_TEMP/tcl-951-darwin-route-smoke.log"
          grep -q 'TCL-951 integrated exact checked-out head:' "$RUNNER_TEMP/tcl-951-darwin-route-smoke.log"
          grep -q 'TCL-951 integrated route evidence: POSITIVE' "$RUNNER_TEMP/tcl-951-darwin-route-smoke.log"
          grep -q 'TCL-951 disclosure: Partial' "$RUNNER_TEMP/tcl-951-darwin-route-smoke.log"
          grep -q 'TCL-947 Darwin evidence: POSITIVE' "$RUNNER_TEMP/group-route-feasibility-darwin.log"
          grep -q 'TCL-947 Darwin localhost: LIMITATION' "$RUNNER_TEMP/group-route-feasibility-darwin.log"

      - name: Compile preserved proxy and OpenCode route cells
        shell: bash
        run: |
          set -o pipefail
          go test ./pkg/claude/session \
            -run 'TestBuildTclaudeLayerLaunchSpec|TestSeatbeltProxyFloorCanCarveOneManagedServerBind' \
            -count=1 -timeout 600s 2>&1 | tee "$RUNNER_TEMP/tcl-951-preserved-cells.log"

      - name: Run supplemental Darwin route contract and bridge cells
        shell: bash
        run: |
          set -o pipefail
          go test ./pkg/claude/agentd \
            -run '^TestDarwinRouteAdapter(RefusesMissingLaunchContracts|ProductionBridgeUsesExactContracts)$' \
            -count=1 -timeout 600s -v 2>&1 | tee "$RUNNER_TEMP/tcl-951-route-authority.log"

      - name: Upload Darwin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group-route-feasibility-darwin
          path: |
            ${{ runner.temp }}/group-route-feasibility-darwin.log
            ${{ runner.temp }}/tcl-951-darwin-route-smoke.log
            ${{ runner.temp }}/tcl-951-preserved-cells.log
            ${{ runner.temp }}/tcl-951-route-authority.log
