# TEMPORARY (#3999, awb tcl-gejtfc; remove before merge): the Seatbelt
# minimal pair (a later unix-socket outbound deny breaking an earlier
# localhost:N TCP allow) on hosted macos-latest, to compare with the
# self-hosted macOS 27.2 runner. Only for this PR's branch.
name: TEMP Seatbelt probe (hosted)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'ci/self-hosted-macos-pr'
    name: Seatbelt minimal pair (hosted macos-latest)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Probe
        run: |
          sw_vers
          python3 scripts/ci/seatbelt-loopback-probe.py --pair-only | tee -a "$GITHUB_STEP_SUMMARY"
