name: Sandbox v2 Seatbelt smoke

# Reusable job shared by ci.yml, release.yml and manual-release.yml. Each caller
# keeps its own gate (needs/if/permissions) on the calling job, so this file holds
# only the job body and is the single place to change it.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  sandbox-v2-seatbelt-smoke:
    name: Sandbox v2 Seatbelt smoke
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node for OpenCode smoke
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # Keep this deliberately aligned with the Linux executor smoke. A pin
      # bump changes the exercised upstream tool/server contract and must be a
      # reviewed source change, never runner-image drift.
      - name: Install pinned OpenCode smoke binary
        run: |
          npm install --global opencode-ai@1.18.6
          opencode --version

      - name: Install pinned proxy-cooperation harnesses
        run: |
          npm install --global \
            @anthropic-ai/claude-code@2.1.220 \
            @openai/codex@0.145.0
          claude --version | grep -qF '2.1.220'
          codex --version | grep -qF '0.145.0'

      - name: Probe Seatbelt deny-write support
        shell: bash
        run: |
          probe="$RUNNER_TEMP/tclaude-seatbelt-probe"
          rm -f "$probe"
          profile='(version 1)
          (allow default)
          (deny file-write* (literal (param "TCLAUDE_PROBE")))'
          kernel=$(uname -a)
          macos=$(sw_vers)

          set +e
          probe_output=$(TCLAUDE_PROBE="$probe" /usr/bin/sandbox-exec \
            -p "$profile" "-DTCLAUDE_PROBE=$probe" -- /bin/sh -c \
            'test ! -e "$TCLAUDE_PROBE" && ! touch "$TCLAUDE_PROBE"' 2>&1)
          probe_status=$?
          set -e

          if [ -e "$probe" ]; then
            probe_created=yes
          else
            probe_created=no
          fi
          rm -f "$probe"

          printf '%s\n' "$probe_output"
          printf 'Seatbelt probe exit code: %s\n' "$probe_status"
          printf 'Probe path created: %s\n' "$probe_created"

          if [ "$probe_status" -ne 0 ] || [ "$probe_created" != "no" ]; then
            if [ -z "$probe_output" ]; then
              probe_output="<no output>"
            fi
            {
              echo "### Sandbox v2 Seatbelt smoke prerequisite failed"
              echo
              echo "The real Darwin smoke was not executed. The GitHub runner image or Seatbelt policy likely changed."
              echo
              echo "**macOS:**"
              echo '```text'
              printf '%s\n' "$macos"
              echo '```'
              echo "**Kernel:**"
              echo '```text'
              printf '%s\n' "$kernel"
              echo '```'
              printf '**Seatbelt probe exit code:** %s\n\n' "$probe_status"
              printf '**Probe path created:** %s\n\n' "$probe_created"
              echo "**Seatbelt probe output:**"
              echo '```text'
              printf '%s\n' "$probe_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::sandbox v2 Seatbelt smoke prerequisite failed; see the step summary for runner diagnostics"
            exit 1
          fi

      - name: Build tclaude for authenticated smoke
        run: go build -o "$RUNNER_TEMP/tclaude-sandbox-v2" .

      - name: Run Seatbelt platform assumptions
        env:
          TCLAUDE_SANDBOX_ASSUMPTIONS: "1"
        run: |
          assumption_log="$RUNNER_TEMP/seatbelt-assumptions.log"
          go test ./pkg/claude/sandboxassumptions -run '^TestSeatbeltAssumptions$' -count=1 -v -timeout=180s |
            tee "$assumption_log"
          if ! grep -q '^--- PASS: TestSeatbeltAssumptions ' "$assumption_log"; then
            {
              echo "### Seatbelt assumption suite did not complete"
              echo
              echo "The hardware-backed Seatbelt contract did not report an explicit pass."
              echo "A skip, missing/renamed test, build-tag mismatch, or zero-test success is a hard failure."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestSeatbeltAssumptions did not report an explicit pass"
            exit 1
          fi

      - name: Run sandbox v2 Seatbelt smoke
        env:
          TCLAUDE_SANDBOX_V2_SMOKE: "1"
          TCLAUDE_OPENCODE_PROXY_DARWIN_SMOKE: "1"
          TCLAUDE_SANDBOX_V2_TCLAUDE_BINARY: ${{ runner.temp }}/tclaude-sandbox-v2
        run: |
          driver_log="$RUNNER_TEMP/seatbelt-smoke-driver.log"
          set +e
          bash scripts/seatbelt-smoke/driver.sh | tee "$driver_log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          if [[ "${pipeline_status[0]}" -ne 0 || "${pipeline_status[1]}" -ne 0 ]]; then
            echo "::error::seatbelt driver pipeline failed (driver=${pipeline_status[0]}, tee=${pipeline_status[1]})"
            exit 1
          fi
          if ! grep -q '^Seatbelt smoke evidence complete:$' "$driver_log"; then
            echo "::error::seatbelt driver did not print its completion sentinel — it exited before finishing"
            exit 1
          fi

      - name: Run OpenCode Seatbelt executor smoke
        env:
          TCLAUDE_OPENCODE_LAYER_SMOKE: "1"
          TCLAUDE_SANDBOX_V2_TCLAUDE_BINARY: ${{ runner.temp }}/tclaude-sandbox-v2
        run: |
          smoke_log="$RUNNER_TEMP/opencode-tclaude-layer-darwin-smoke.log"
          go test ./pkg/claude/agentd -run '^TestOpenCodeTclaudeLayerDarwinExecutorSmoke$' -count=1 -v -timeout=120s |
            tee "$smoke_log"
          if ! grep -q '^--- PASS: TestOpenCodeTclaudeLayerDarwinExecutorSmoke ' "$smoke_log"; then
            {
              echo "### OpenCode Seatbelt executor smoke did not complete"
              echo
              echo "The real OpenCode serve/attach/tool/identity smoke did not report an explicit pass."
              echo "The job provisions pinned opencode-ai@1.18.6 and refuses a skipped or renamed test."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestOpenCodeTclaudeLayerDarwinExecutorSmoke did not report an explicit pass"
            exit 1
          fi
