name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      homebrew_only:
        description: "Only sync the Homebrew tap to the latest release (skip test/build/release)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  sandbox-v2-smoke:
    if: ${{ inputs.homebrew_only != true }}
    uses: ./.github/workflows/reusable-sandbox-v2-smoke.yml

  sandbox-v2-seatbelt-smoke:
    if: ${{ inputs.homebrew_only != true }}
    uses: ./.github/workflows/reusable-sandbox-v2-seatbelt-smoke.yml

  # golangci-lint is platform-independent, so run it once on a single runner
  # rather than duplicating it across the test matrix. Lint, tests, version,
  # builds, and the two sandbox smokes all run in parallel; publishing waits
  # for every one of those boundaries.
  lint:
    if: ${{ inputs.homebrew_only != true }}
    uses: ./.github/workflows/reusable-lint.yml

  test:
    name: Test
    permissions:
      contents: read
      actions: write # Prune only this job's bounded main build snapshots.
    if: ${{ inputs.homebrew_only != true }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Same shard split as PR CI, via the shared test-suite action — one
        # partition definition for both flows. Unlike PR CI there is no
        # macOS-jstest exclusion: this post-merge run is where that cell's
        # cross-OS coverage lives.
        shard: [agentd, jstest, process, sandbox, rest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # -race is OFF by default, gated behind the RUN_RACE repo variable (see ci.yml
      # for the full rationale). ubuntu+macOS only, so enabling it is race-detector-safe.
      - name: Test suite (${{ matrix.shard }})
        uses: ./.github/actions/test-suite
        with:
          shard: ${{ matrix.shard }}
          race: ${{ vars.RUN_RACE }}
          save-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  # Version generation only computes the next number (read-only); it runs in
  # parallel with test/lint/build. The git tag is pushed later, by the release
  # job, so a tag is only created once test + lint + build have all passed.
  version:
    name: Generate Version
    if: ${{ inputs.homebrew_only != true }}
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")

          # Calculate new version - increment patch version
          IFS='.' read -r major minor patch <<< "${LATEST_TAG/v/}"
          NEW_VERSION="v$major.$minor.$((patch+1))"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Creating new version: $NEW_VERSION"

  # Compute the release version before building, and stamp that exact value.
  # Publishing the tag remains behind all test/lint/build/smoke gates.
  build:
    needs: [version]
    name: Build (${{ matrix.os }})
    if: ${{ inputs.homebrew_only != true }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: build --single-target --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TCLAUDE_RELEASE_VERSION: ${{ needs.version.outputs.new_version }}
          TCLAUDE_INSTALL_METHOD: release

      # The repo ships three binaries: the tclaude CLI, the standalone
      # tclaude-agentd daemon, and the tclaude-hub federation relay. All must
      # come out of every platform build.
      # Without this assertion, dropping or mis-targeting a .goreleaser.yaml
      # build id would silently publish a release missing one of them.
      - name: Verify every binary was built and version stamped
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.new_version }}
        shell: bash
        run: |
          set -euo pipefail
          for binary in tclaude tclaude-agentd tclaude-hub; do
            count=$(find dist -type f -name "$binary" -perm -u+x | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::goreleaser produced no $binary binary in dist/"
              exit 1
            fi
            echo "$binary: $count binary(s)"
            while IFS= read -r path; do
              "$path" --tclaude-build-info | python3 -c 'import json,os,sys; info=json.load(sys.stdin); assert info["version"] == os.environ["EXPECTED_VERSION"]; assert info["install_method"] == "release"; assert info["protocol_version"] > 0'
            done < <(find dist -type f -name "$binary" -perm -u+x)
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  # Publishing gate: only runs once tests, lint, builds, and both real sandbox
  # smokes have all succeeded. This is where the side effects happen — pushing
  # the release tag and creating the GitHub release — so neither can occur
  # before every enforcement boundary is green.
  release:
    name: Release
    if: ${{ inputs.homebrew_only != true }}
    runs-on: ubuntu-latest
    needs:
      [test, lint, version, build, sandbox-v2-smoke, sandbox-v2-seatbelt-smoke,
       filtered-proxy-smoke, proxy-posture-e2e]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push Tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -a ${{ needs.version.outputs.new_version }} -m "Release ${{ needs.version.outputs.new_version }}"
          git push origin ${{ needs.version.outputs.new_version }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The build jobs assert the same thing before upload; this re-checks it
      # on the far side of the artifact round-trip, so a binary lost between
      # upload and repack fails here instead of shipping a short release.
      - name: Verify every binary survived the artifact round-trip
        shell: bash
        run: |
          set -euo pipefail
          for binary in tclaude tclaude-agentd tclaude-hub; do
            count=$(find dist -type f -name "$binary" | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::no $binary binary in the downloaded artifacts"
              exit 1
            fi
            echo "$binary: $count binary(s)"
          done

      - name: Create archives
        run: |
          cd dist
          for dir in */; do
            name="${dir%/}"
            tar -czvf "${name}.tar.gz" "$dir"
          done
          sha256sum *.tar.gz > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.new_version }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Keep the Homebrew tap (tofutools/homebrew-tap) in sync with each release.
  # The formula builds from source, so all we bump is the source-tarball URL
  # and its sha256. Requires a HOMEBREW_TAP_TOKEN secret (a PAT / fine-grained
  # token with Contents:write on tofutools/homebrew-tap); on the release path,
  # a missing token no-ops so releases are never blocked on the tap.
  #
  # Run it on its own — without cutting a release — via the Actions "Run
  # workflow" button with the "homebrew_only" box ticked (or:
  #   gh workflow run release.yml -f homebrew_only=true
  # ). In that mode it syncs the formula to the LATEST published release and a
  # missing token is a hard error (you asked for it explicitly).
  homebrew:
    name: Update Homebrew tap
    # Runs after a normal release, OR standalone when homebrew_only is set
    # (in which case test/version/build/smoke/release jobs are skipped, so this
    # gates on !cancelled() rather than success of those jobs).
    if: ${{ !cancelled() && (inputs.homebrew_only == true || (needs.version.result == 'success' && needs.release.result == 'success' && needs['sandbox-v2-smoke'].result == 'success' && needs['sandbox-v2-seatbelt-smoke'].result == 'success')) }}
    runs-on: ubuntu-latest
    needs: [version, release, sandbox-v2-smoke, sandbox-v2-seatbelt-smoke]
    permissions:
      contents: read
    steps:
      - name: Check for tap token
        id: guard
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_ONLY: ${{ inputs.homebrew_only }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            if [ "${HOMEBREW_ONLY}" = "true" ]; then
              echo "::error::HOMEBREW_TAP_TOKEN is not set (or empty)."
              exit 1
            fi
            echo "HOMEBREW_TAP_TOKEN not set - skipping Homebrew tap update."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tap
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: tofutools/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        id: formula
        if: steps.guard.outputs.enabled == 'true'
        env:
          # Empty on the homebrew_only path (the version job is skipped); we
          # then resolve the latest published release tag instead.
          VERSION: ${{ needs.version.outputs.new_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${VERSION}"
          if [ -z "${version}" ]; then
            version="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
            echo "Resolved latest release: ${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          url="https://github.com/tofutools/tclaude/archive/refs/tags/${version}.tar.gz"
          # GitHub's auto-generated source tarball can lag the tag by a few
          # seconds, so retry until it's downloadable.
          ok=false
          for i in $(seq 1 12); do
            if curl -fsSL --remove-on-error "$url" -o src.tgz; then ok=true; break; fi
            echo "source tarball not ready yet (attempt $i), retrying..."
            sleep 5
          done
          if [ "$ok" != true ]; then
            echo "source tarball never became available: $url" >&2
            exit 1
          fi
          sha="$(sha256sum src.tgz | cut -d' ' -f1)"
          rm -f src.tgz
          sed -i \
            -e "s|^  url \".*\"|  url \"${url}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${sha}\"|" \
            tap/Formula/tclaude.rb
          echo "Updated formula:"
          grep -E '^[[:space:]]+(url|sha256)' tap/Formula/tclaude.rb

      - name: Commit and push
        if: steps.guard.outputs.enabled == 'true'
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git add Formula/tclaude.rb
          git commit -m "tclaude ${{ steps.formula.outputs.version }}"
          git push

  # The filtered-network proxy smokes build real sandboxes against live
  # fixtures. Everything that decides what runs, what counts as evidence, which
  # harness versions are pinned and how fixtures are built lives in
  # scripts/filtered-proxy-smoke/ — so extending the smokes is a repo change and
  # a review, not a workflow merge. Keep this job generic: if a change here is
  # ever needed to add a smoke, that belongs in the entrypoint instead.
  filtered-proxy-smoke:
    if: ${{ inputs.homebrew_only != true }}
    uses: ./.github/workflows/reusable-filtered-proxy-smoke.yml

  # The end-to-end proxy-posture smokes verify the ASSEMBLED posture: authored
  # policy in, real launch, real enforcement observed, for each posture the
  # conditional-deployment table distinguishes — including the three that must
  # deploy no proxy. Everything that decides what runs and what counts as
  # evidence lives in scripts/proxy-posture-e2e/, so extending it is a repo
  # change and a review, not a workflow merge. Keep this job generic: if a
  # change here is ever needed to add a scenario, that belongs in the entrypoint
  # instead.
  proxy-posture-e2e:
    if: ${{ inputs.homebrew_only != true }}
    uses: ./.github/workflows/reusable-proxy-posture-e2e.yml
