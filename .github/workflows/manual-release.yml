name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version increment type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

# Share the "release" concurrency group with release.yml so manual and automated
# releases serialize against each other (the group string is repo-global, not
# per-workflow). The next version number is computed early and read-only, but the
# tag isn't pushed until the release job — serializing whole runs prevents two
# in-flight releases from computing, then racing to push, the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  sandbox-v2-smoke:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-sandbox-v2-smoke.yml

  sandbox-v2-seatbelt-smoke:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-sandbox-v2-seatbelt-smoke.yml

  # golangci-lint is platform-independent, so run it once on a single runner
  # rather than across the test matrix. Lint, tests, version, builds, and the
  # two sandbox smokes all run in parallel; publishing waits for every one of
  # those boundaries.
  lint:
    uses: ./.github/workflows/reusable-lint.yml

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        # Same shard split as PR CI and release.yml, via the shared
        # test-suite action — one partition definition everywhere.
        shard: [agentd, jstest, process, sandbox, rest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test suite (${{ matrix.shard }})
        uses: ./.github/actions/test-suite
        with:
          shard: ${{ matrix.shard }}

  # Version generation only computes the next number (read-only); it runs in
  # parallel with test/lint/build. The git tag is pushed later, by the release
  # job, so a tag is only created once test + lint + build have all passed.
  version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")

          # Split the version
          IFS='.' read -r major minor patch <<< "${LATEST_TAG/v/}"

          # Calculate new version based on input
          if [[ "${{ github.event.inputs.version_type }}" == "major" ]]; then
            NEW_VERSION="v$((major+1)).0.0"
          elif [[ "${{ github.event.inputs.version_type }}" == "minor" ]]; then
            NEW_VERSION="v$major.$((minor+1)).0"
          else
            NEW_VERSION="v$major.$minor.$((patch+1))"
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Creating new version: $NEW_VERSION"

  # Builds run in parallel with test/lint/version. goreleaser builds with
  # --snapshot (version_template "{{ .Tag }}-next", derived from the latest
  # existing tag), so the build never depends on the new version or its tag.
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: build --single-target --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The repo ships two binaries: the tclaude CLI and the standalone
      # tclaude-agentd daemon. Both must come out of every platform build.
      # Without this assertion, dropping or mis-targeting a .goreleaser.yaml
      # build id would silently publish a release missing one of them.
      - name: Verify both binaries were built
        shell: bash
        run: |
          set -euo pipefail
          for binary in tclaude tclaude-agentd; do
            count=$(find dist -type f -name "$binary" -perm -u+x | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::goreleaser produced no $binary binary in dist/"
              exit 1
            fi
            echo "$binary: $count binary(s)"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  # Publishing gate: only runs once tests, lint, builds, and both real sandbox
  # smokes have all succeeded. This is where the side effects happen — pushing
  # the release tag and creating the GitHub release — so neither can occur
  # before every enforcement boundary is green.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      [test, lint, version, build, sandbox-v2-smoke, sandbox-v2-seatbelt-smoke,
       filtered-proxy-smoke, proxy-posture-e2e]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push Tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -a ${{ needs.version.outputs.new_version }} -m "Release ${{ needs.version.outputs.new_version }}"
          git push origin ${{ needs.version.outputs.new_version }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The build jobs assert the same thing before upload; this re-checks it
      # on the far side of the artifact round-trip, so a binary lost between
      # upload and repack fails here instead of shipping a short release.
      - name: Verify both binaries survived the artifact round-trip
        shell: bash
        run: |
          set -euo pipefail
          for binary in tclaude tclaude-agentd; do
            count=$(find dist -type f -name "$binary" | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::no $binary binary in the downloaded artifacts"
              exit 1
            fi
            echo "$binary: $count binary(s)"
          done

      - name: Create archives
        run: |
          cd dist
          for dir in */; do
            name="${dir%/}"
            tar -czvf "${name}.tar.gz" "$dir"
          done
          sha256sum *.tar.gz > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.new_version }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The filtered-network proxy smokes build real sandboxes against live
  # fixtures. Everything that decides what runs, what counts as evidence, which
  # harness versions are pinned and how fixtures are built lives in
  # scripts/filtered-proxy-smoke/ — so extending the smokes is a repo change and
  # a review, not a workflow merge. Keep this job generic: if a change here is
  # ever needed to add a smoke, that belongs in the entrypoint instead.
  filtered-proxy-smoke:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-filtered-proxy-smoke.yml

  # The end-to-end proxy-posture smokes verify the ASSEMBLED posture: authored
  # policy in, real launch, real enforcement observed, for each posture the
  # conditional-deployment table distinguishes — including the three that must
  # deploy no proxy. Everything that decides what runs and what counts as
  # evidence lives in scripts/proxy-posture-e2e/, so extending it is a repo
  # change and a review, not a workflow merge. Keep this job generic: if a
  # change here is ever needed to add a scenario, that belongs in the entrypoint
  # instead.
  proxy-posture-e2e:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-proxy-posture-e2e.yml
