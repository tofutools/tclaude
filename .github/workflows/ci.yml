name: CI

on:
  workflow_dispatch:
    inputs:
      native_only:
        description: Run only the native sandbox platform checks during development
        type: boolean
        default: false
  workflow_call: {}
  pull_request:
    branches: [main, refactor/platform-v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    if: ${{ !inputs.native_only }}
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
  lint:
    if: ${{ !inputs.native_only }}
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
  test:
    name: Product acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install terminal test prerequisite
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install --yes tmux bubblewrap
          else
            brew install tmux
          fi
      - name: Build both shipped binaries
        run: |
          go build -o "$RUNNER_TEMP/tclaude" .
          go build -o "$RUNNER_TEMP/tclaude-agentd" ./cmd/tclaude-agentd
          "$RUNNER_TEMP/tclaude" --help
          "$RUNNER_TEMP/tclaude-agentd" --help
      - name: Require real native sandbox enforcement
        shell: bash
        # The disposable runner grants namespaces to this fixture only. Do not
        # weaken an operator host's user-namespace or AppArmor configuration.
        run: |
          go test -race -c ./internal/backend/host -o "$RUNNER_TEMP/sandbox-native.test"
          go test -race -c ./internal/backend/providers/copilot -o "$RUNNER_TEMP/sandbox-provider.test"
          go test -race -c ./internal/backend/providers/codex -o "$RUNNER_TEMP/sandbox-codex.test"
          go test -race -c ./internal/backend/providers/claude -o "$RUNNER_TEMP/sandbox-claude.test"
          go test -race -c ./internal/backend/providers/opencode -o "$RUNNER_TEMP/sandbox-opencode.test"
          if [[ "$RUNNER_OS" == Linux ]]; then
            # Inside the new user namespace, root cannot use host capabilities
            # to traverse runner-owned private directories. Own the fixture as
            # the same UID that will own the disposable namespace.
            native_dir=$(sudo mktemp -d /tmp/tclaude-native.XXXXXX)
            trap 'sudo rm -rf "$native_dir"' EXIT
            sudo install -m 0700 "$RUNNER_TEMP/sandbox-native.test" "$native_dir/sandbox-native.test"
            sudo install -m 0700 "$RUNNER_TEMP/sandbox-provider.test" "$native_dir/sandbox-provider.test"
            sudo install -m 0700 "$RUNNER_TEMP/sandbox-codex.test" "$native_dir/sandbox-codex.test"
            sudo install -m 0700 "$RUNNER_TEMP/sandbox-claude.test" "$native_dir/sandbox-claude.test"
            sudo install -m 0700 "$RUNNER_TEMP/sandbox-opencode.test" "$native_dir/sandbox-opencode.test"
            sudo install -m 0700 "$RUNNER_TEMP/tclaude" "$native_dir/tclaude"
            sudo env TMPDIR="$native_dir" TCLAUDE_SANDBOX_ROOT_FIXTURE_PARENT=/var/tmp TCLAUDE_REQUIRE_SANDBOX_NATIVE=1 "$native_dir/sandbox-native.test" -test.run '^(TestSandboxDescriptor|TestUnixControl)' -test.timeout 1m -test.v
            sudo env TMPDIR="$native_dir" TCLAUDE_SANDBOX_BOOTSTRAP="$native_dir/tclaude" "$native_dir/sandbox-provider.test" -test.run '^TestProviderHostSandbox' -test.timeout 1m -test.v
            sudo env TMPDIR="$native_dir" TCLAUDE_SANDBOX_BOOTSTRAP="$native_dir/tclaude" "$native_dir/sandbox-codex.test" -test.run '^TestProviderHostSandbox' -test.timeout 1m -test.v
            sudo env TMPDIR="$native_dir" TCLAUDE_SANDBOX_BOOTSTRAP="$native_dir/tclaude" "$native_dir/sandbox-claude.test" -test.run '^TestProviderHostSandbox' -test.timeout 1m -test.v
            sudo env TMPDIR="$native_dir" TCLAUDE_SANDBOX_BOOTSTRAP="$native_dir/tclaude" "$native_dir/sandbox-opencode.test" -test.run '^(TestServerRelay|TestProviderHostSandbox)' -test.timeout 1m -test.v
          else
            TCLAUDE_REQUIRE_SANDBOX_NATIVE=1 "$RUNNER_TEMP/sandbox-native.test" -test.run '^(TestSandboxDescriptor|TestUnixControl)' -test.timeout 1m -test.v
            TCLAUDE_SANDBOX_BOOTSTRAP="$RUNNER_TEMP/tclaude" "$RUNNER_TEMP/sandbox-provider.test" -test.run '^TestProviderHostSandbox' -test.timeout 1m -test.v
            TCLAUDE_SANDBOX_BOOTSTRAP="$RUNNER_TEMP/tclaude" "$RUNNER_TEMP/sandbox-codex.test" -test.run '^TestProviderHostSandbox' -test.timeout 1m -test.v
            TCLAUDE_SANDBOX_BOOTSTRAP="$RUNNER_TEMP/tclaude" "$RUNNER_TEMP/sandbox-claude.test" -test.run '^TestProviderHostSandbox' -test.timeout 1m -test.v
            TCLAUDE_SANDBOX_BOOTSTRAP="$RUNNER_TEMP/tclaude" "$RUNNER_TEMP/sandbox-opencode.test" -test.run '^(TestServerRelay|TestProviderHostSandbox)' -test.timeout 1m -test.v
          fi
      - name: Diagnose native sandbox denial on macOS
        if: ${{ failure() && runner.os == 'macOS' }}
        run: sudo /usr/bin/log show --last 3m --style compact --predicate 'process == "sandbox-exec" OR (process == "kernel" AND (eventMessage CONTAINS[c] "sandbox" OR eventMessage CONTAINS[c] "sandbox-native" OR eventMessage CONTAINS[c] "signature"))'
      - name: Diagnose confined child crash on macOS
        if: ${{ failure() && runner.os == 'macOS' }}
        shell: bash
        run: |
          for report in "$HOME"/Library/Logs/DiagnosticReports/sandbox-native*.ips; do
            if [[ -f "$report" ]]; then
              cat "$report"
            fi
          done
      - name: Full product race suite
        if: ${{ !inputs.native_only }}
        run: go test -race ./... -count=1 -timeout 15m
  browser:
    if: ${{ !inputs.native_only }}
    name: Offline browser acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Require Chrome
        run: google-chrome --version
      - name: Browser and public API journeys
        env:
          TCLAUDE_BROWSER_SMOKE: '1'
        # The full serial browser matrix has outgrown the original ten-minute budget.
        # Individual journey contexts remain bounded.
        run: go test -race ./internal/product/browser -count=1 -timeout 20m
