name: CI

on:
  pull_request:
    # main-codex is the long-lived harness-independence integration branch; gate
    # its increment PRs with the same CI as main. Drop it once main-codex→main lands.
    # implement-stable-agent-identity is the long-lived JOH-26 integration branch
    # (stable agent_id, decoupled from conv_id) — same deal; drop it once it→main lands.
    # dnd-palette is the long-lived drag-and-drop-palette integration branch
    # (JOH-374..377) — same deal; drop it once dnd-palette→main lands.
    branches: [main, main-codex, implement-stable-agent-identity, dnd-palette]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # golangci-lint is platform-independent, so run it once on a single runner
  # rather than duplicating it across the test matrix.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  sandbox-v2-smoke:
    name: Sandbox v2 bubblewrap smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node for OpenCode smoke
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Install pinned OpenCode smoke binary
        run: |
          npm install --global opencode-ai@1.18.6
          opencode --version

      - name: Unlock and probe bubblewrap user namespace support
        shell: bash
        run: |
          restriction=kernel.apparmor_restrict_unprivileged_userns
          kernel=$(uname -a)

          set +e
          before=$(sysctl -n "$restriction" 2>&1)
          unlock_output=$(sudo sysctl -w "$restriction=0" 2>&1)
          unlock_status=$?
          after=$(sysctl -n "$restriction" 2>&1)
          readback_status=$?
          bwrap_output=$(bwrap --die-with-parent --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp -- true 2>&1)
          bwrap_status=$?
          set -e

          printf 'before: %s=%s\n' "$restriction" "$before"
          printf '%s\n' "$unlock_output"
          printf 'after: %s=%s\n' "$restriction" "$after"
          printf '%s\n' "$bwrap_output"
          printf 'bubblewrap exit code: %s\n' "$bwrap_status"

          if [ "$unlock_status" -ne 0 ] ||
             [ "$readback_status" -ne 0 ] ||
             [ "$after" != "0" ] ||
             [ "$bwrap_status" -ne 0 ]; then
            if [ -z "$bwrap_output" ]; then
              bwrap_output="<no output>"
            fi
            {
              echo "### Sandbox v2 bubblewrap smoke prerequisite failed"
              echo
              echo "The real bubblewrap smoke was not executed. The GitHub runner image or AppArmor policy likely changed."
              echo
              printf '**Image:** %s %s\n\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
              echo "**Kernel:**"
              echo '```text'
              printf '%s\n' "$kernel"
              echo '```'
              printf '**Sysctl before:** %s\n\n' "$before"
              printf '**Sysctl write exit code:** %s\n\n' "$unlock_status"
              echo "**Sysctl write output:**"
              echo '```text'
              printf '%s\n' "$unlock_output"
              echo '```'
              printf '**Sysctl after:** %s (read exit code %s)\n\n' "$after" "$readback_status"
              printf '**Bubblewrap exit code:** %s\n\n' "$bwrap_status"
              echo "**Bubblewrap output:**"
              echo '```text'
              printf '%s\n' "$bwrap_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::sandbox v2 bubblewrap smoke prerequisite failed; see the step summary for runner diagnostics"
            exit 1
          fi

      - name: Build tclaude for authenticated smoke
        run: go build -o "$RUNNER_TEMP/tclaude-sandbox-v2" .

      - name: Run sandbox v2 bubblewrap smoke
        env:
          TCLAUDE_SANDBOX_V2_SMOKE: "1"
          TCLAUDE_SANDBOX_V2_TCLAUDE_BINARY: ${{ runner.temp }}/tclaude-sandbox-v2
        run: |
          smoke_log="$RUNNER_TEMP/tclaude-layer-bubblewrap-smoke.log"
          go test ./pkg/claude/session -run '^TestTclaudeLayerHostSmoke$' -count=1 -v -timeout=120s |
            tee "$smoke_log"
          if ! grep -q '^--- PASS: TestTclaudeLayerHostSmoke ' "$smoke_log"; then
            {
              echo "### Sandbox v2 bubblewrap smoke did not complete"
              echo
              echo "The test command exited successfully without reporting that the named real smoke passed."
              echo "The test name, build constraints, or smoke gate likely changed; see the test log."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Sandbox v2 bubblewrap smoke did not report an explicit pass (TestTclaudeLayerHostSmoke)"
            exit 1
          fi

      - name: Run OpenCode executor sandbox smoke
        env:
          TCLAUDE_OPENCODE_LAYER_SMOKE: "1"
          TCLAUDE_SANDBOX_V2_TCLAUDE_BINARY: ${{ runner.temp }}/tclaude-sandbox-v2
        run: |
          smoke_log="$RUNNER_TEMP/opencode-tclaude-layer-smoke.log"
          go test ./pkg/claude/agentd -run '^TestOpenCodeTclaudeLayerExecutorSmoke$' -count=1 -v -timeout=120s |
            tee "$smoke_log"
          if ! grep -q '^--- PASS: TestOpenCodeTclaudeLayerExecutorSmoke ' "$smoke_log"; then
            {
              echo "### OpenCode executor sandbox smoke did not complete"
              echo
              echo "The real OpenCode serve/attach/tool/identity smoke did not report an explicit pass."
              echo "The job provisions a pinned OpenCode binary and uses the same AppArmor userns unlock as the sandbox v2 host smoke."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestOpenCodeTclaudeLayerExecutorSmoke did not report an explicit pass"
            exit 1
          fi

  sandbox-v2-seatbelt-smoke:
    name: Sandbox v2 Seatbelt smoke
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Probe Seatbelt deny-write support
        shell: bash
        run: |
          probe="$RUNNER_TEMP/tclaude-seatbelt-probe"
          rm -f "$probe"
          profile='(version 1)
          (allow default)
          (deny file-write* (literal (param "TCLAUDE_PROBE")))'
          kernel=$(uname -a)
          macos=$(sw_vers)

          set +e
          probe_output=$(TCLAUDE_PROBE="$probe" /usr/bin/sandbox-exec \
            -p "$profile" "-DTCLAUDE_PROBE=$probe" -- /bin/sh -c \
            'test ! -e "$TCLAUDE_PROBE" && ! touch "$TCLAUDE_PROBE"' 2>&1)
          probe_status=$?
          set -e

          if [ -e "$probe" ]; then
            probe_created=yes
          else
            probe_created=no
          fi
          rm -f "$probe"

          printf '%s\n' "$probe_output"
          printf 'Seatbelt probe exit code: %s\n' "$probe_status"
          printf 'Probe path created: %s\n' "$probe_created"

          if [ "$probe_status" -ne 0 ] || [ "$probe_created" != "no" ]; then
            if [ -z "$probe_output" ]; then
              probe_output="<no output>"
            fi
            {
              echo "### Sandbox v2 Seatbelt smoke prerequisite failed"
              echo
              echo "The real Darwin smoke was not executed. The GitHub runner image or Seatbelt policy likely changed."
              echo
              echo "**macOS:**"
              echo '```text'
              printf '%s\n' "$macos"
              echo '```'
              echo "**Kernel:**"
              echo '```text'
              printf '%s\n' "$kernel"
              echo '```'
              printf '**Seatbelt probe exit code:** %s\n\n' "$probe_status"
              printf '**Probe path created:** %s\n\n' "$probe_created"
              echo "**Seatbelt probe output:**"
              echo '```text'
              printf '%s\n' "$probe_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::sandbox v2 Seatbelt smoke prerequisite failed; see the step summary for runner diagnostics"
            exit 1
          fi

      - name: Build tclaude for authenticated smoke
        run: go build -o "$RUNNER_TEMP/tclaude-sandbox-v2" .

      - name: Run sandbox v2 Seatbelt smoke
        env:
          TCLAUDE_SANDBOX_V2_SMOKE: "1"
          TCLAUDE_SANDBOX_V2_TCLAUDE_BINARY: ${{ runner.temp }}/tclaude-sandbox-v2
        run: |
          smoke_log="$RUNNER_TEMP/tclaude-layer-darwin-smoke.log"
          go test ./pkg/claude/session -run '^TestTclaudeLayerDarwinSmoke$' -count=1 -v -timeout=120s |
            tee "$smoke_log"
          if ! grep -q '^--- PASS: TestTclaudeLayerDarwinSmoke ' "$smoke_log"; then
            {
              echo "### Sandbox v2 Seatbelt smoke did not complete"
              echo
              echo "The test command exited successfully without reporting that the named real smoke passed."
              echo "The test name, build constraints, or smoke gate likely changed; see the test log."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestTclaudeLayerDarwinSmoke did not report an explicit pass"
            exit 1
          fi

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      # One red shard must not cancel its siblings — the point of sharding is
      # seeing exactly which slice fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The suite is sharded across concurrent runners so the wall clock is
        # bounded by the slowest single package instead of the sum. The shard
        # partition itself (and the rationale for each slice) lives in the
        # shared .github/actions/test-suite action, which the release
        # workflows consume with the same split — keep the shard list here in
        # sync with the case statement there.
        shard: [agentd, jstest, process, sandbox, rest]
        exclude:
          # PR CI skips macOS jstest: the shard exercises browser-targeted
          # dashboard JS under Node + the vendored LinkeDOM runtime, so
          # nothing in it varies by runner OS (end-user browsers are a
          # different axis entirely) and one Linux run is full PR coverage.
          # macOS still covers this shard post-merge: release.yml's gating
          # Test job runs the same shard matrix without this exclusion.
          # Residual PR-side gap, accepted knowingly: the Go wrapper in
          # pkg/claude/agentd/jstest itself never builds/runs on darwin
          # before merge, so a darwin-only break there would surface in
          # release.yml (blocking releases) rather than bouncing the
          # offending PR. The Go shards run on both OSes — they carry
          # _unix/_darwin build-tagged code and real fs behavior.
          - os: macos-latest
            shard: jstest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The Go race detector is OFF by default and gated behind the RUN_RACE
      # repository variable (Settings -> Secrets and variables -> Actions ->
      # Variables -> RUN_RACE=true) so it can be enabled later without a code
      # change. It roughly triples the test step's wall-clock, which is why it
      # is opt-in. The suite is race-clean as of this writing, so flipping the
      # variable is safe. -race needs CGO, which the ubuntu/macOS runners have
      # on by default.
      - name: Test suite (${{ matrix.shard }})
        uses: ./.github/actions/test-suite
        with:
          shard: ${{ matrix.shard }}
          race: ${{ vars.RUN_RACE }}
