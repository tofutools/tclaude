name: CI

on:
  pull_request:
    # main-codex is the long-lived harness-independence integration branch; gate
    # its increment PRs with the same CI as main. Drop it once main-codex→main lands.
    # implement-stable-agent-identity is the long-lived JOH-26 integration branch
    # (stable agent_id, decoupled from conv_id) — same deal; drop it once it→main lands.
    # dnd-palette is the long-lived drag-and-drop-palette integration branch
    # (JOH-374..377) — same deal; drop it once dnd-palette→main lands.
    # integration/ui-components is the long-lived standard-UI-components
    # integration branch (tcl-32qwip) — same deal; drop it once it→main lands.
    branches: [main, main-codex, implement-stable-agent-identity, dnd-palette, integration/ui-components]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides which jobs this PR needs; see scripts/ci/classify-changes.py for
  # the rules. Every gated job below skips only when its run_* output says so,
  # and ci-complete checks each job against the same verdict. Every doubt
  # (CI or go.mod touched, unknown path, empty diff, any error) runs
  # everything, and release.yml runs everything on every merge regardless.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.diff.outputs.mode }}
      expected: ${{ steps.diff.outputs.expected }}
      test_matrix: ${{ steps.diff.outputs.test_matrix }}
      run_lint: ${{ steps.diff.outputs.run_lint }}
      run_sandbox_v2_smoke: ${{ steps.diff.outputs.run_sandbox_v2_smoke }}
      run_sandbox_v2_seatbelt_smoke: ${{ steps.diff.outputs.run_sandbox_v2_seatbelt_smoke }}
      run_test: ${{ steps.diff.outputs.run_test }}
      run_copilot_smoke: ${{ steps.diff.outputs.run_copilot_smoke }}
      run_gemini_smoke: ${{ steps.diff.outputs.run_gemini_smoke }}
      run_pi_smoke: ${{ steps.diff.outputs.run_pi_smoke }}
      run_filtered_proxy_smoke: ${{ steps.diff.outputs.run_filtered_proxy_smoke }}
      run_proxy_posture_e2e: ${{ steps.diff.outputs.run_proxy_posture_e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # The harness-smoke verdicts come from scripts/ci/affected's import
      # graph, which needs Go and the module cache.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Classify the PR diff
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/test_classify_changes.py
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/ci/classify-changes.py "$BASE_SHA" HEAD > "$RUNNER_TEMP/classify.out"
          cat "$RUNNER_TEMP/classify.out" >> "$GITHUB_OUTPUT"
          {
            echo '### CI change classification'
            echo '```'
            cat "$RUNNER_TEMP/classify.out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: mkdocs --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install mkdocs-material
        run: pip install mkdocs-material
      - name: Build docs (strict)
        run: mkdocs build --strict

  learn-commands:
    name: Learn commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate Learn commands and flags
        run: go test ./pkg/claude -run '^TestLearnDocsCommandsResolve$' -count=1

  # golangci-lint is platform-independent, so run it once on a single runner
  # rather than duplicating it across the test matrix.
  lint:
    needs: changes
    if: needs.changes.outputs.run_lint == 'true'
    uses: ./.github/workflows/reusable-lint.yml

  sandbox-v2-smoke:
    needs: changes
    if: needs.changes.outputs.run_sandbox_v2_smoke == 'true'
    uses: ./.github/workflows/reusable-sandbox-v2-smoke.yml

  sandbox-v2-seatbelt-smoke:
    needs: changes
    if: needs.changes.outputs.run_sandbox_v2_seatbelt_smoke == 'true'
    uses: ./.github/workflows/reusable-sandbox-v2-seatbelt-smoke.yml

  test:
    needs: changes
    if: needs.changes.outputs.run_test == 'true'
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      # One red shard must not cancel its siblings — the point of sharding is
      # seeing exactly which slice fails.
      fail-fast: false
      # The matrix comes from the change classifier: Linux agentd + jstest +
      # rest for a dashboard-only change, every Linux shard for any other
      # code, and the macOS agentd + rest-all jobs only when the change is
      # platform-specific or sandbox code (or CI itself changed). The shard
      # partition itself (and the rationale for each slice) lives in the
      # shared .github/actions/test-suite action, which the release workflows
      # consume with the same split.
      #
      # macOS never runs jstest on PRs: the shard exercises browser-targeted
      # dashboard JS under Node + the vendored LinkeDOM runtime, so nothing in
      # it varies by runner OS, and one Linux run is full PR coverage. And
      # macOS runners are concurrency-capped, so the small process and sandbox
      # shards run inside one rest-all job there instead of three slots.
      # release.yml keeps the full split on both OSes on every merge, which is
      # where a darwin-only break the classifier did not foresee surfaces.
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Two commits, not one: for a pull_request event actions/checkout
          # builds the merge ref, so HEAD^1 is the base branch commit this PR
          # is measured against. The test-suite action grades the shard
          # against it and skips packages the change cannot reach.
          fetch-depth: 2

      # The Go race detector is OFF by default and gated behind the RUN_RACE
      # repository variable (Settings -> Secrets and variables -> Actions ->
      # Variables -> RUN_RACE=true) so it can be enabled later without a code
      # change. It roughly triples the test step's wall-clock, which is why it
      # is opt-in. The suite is race-clean as of this writing, so flipping the
      # variable is safe. -race needs CGO, which the ubuntu/macOS runners have
      # on by default.
      - name: Test suite (${{ matrix.shard }})
        uses: ./.github/actions/test-suite
        with:
          shard: ${{ matrix.shard }}
          race: ${{ vars.RUN_RACE }}
          # Only the PR flow selects; release.yml and manual-release.yml pass
          # no base and run every shard in full on the merge commit.
          diff-base: HEAD^1

  # Credential-free GitHub Copilot CLI regression smoke (TCL-1046).
  #
  # This is the small per-PR set: the scenarios where tclaude's OWN code meets
  # the real Copilot CLI — our spawner's argv, our directory-trust seeder, our
  # installed hook file, our conv-store, our `tclaude ask` capture, our
  # soft-exit injection. Those can regress on any push, so they are measured on
  # every push, exactly like the OpenCode/Codex/Claude smokes that live in the
  # sandbox jobs above.
  #
  # What is NOT here is the discovery lab that this package was originally
  # built as (TCL-970): Copilot's own permission grammar, deny-tool syntax,
  # native sandbox flags, wire goldens and platform cache layout. Those measure
  # a THIRD-PARTY binary, which cannot change between two of our pushes, so
  # re-proving them per-PR bought nothing for ~9 minutes a run. They are intact
  # in the same package behind TCLAUDE_COPILOT_FIXTURE_LAB and run from
  # .github/workflows/copilot-lab.yml — on demand, and on any change to the
  # fixture package or the harness itself. Bumping the CLI version means
  # running that workflow and reading the golden diff, which is the act the
  # evidence was always meant to be reviewed by.
  #
  # Linux only, and that is a decision rather than an omission. Everything
  # macOS-SPECIFIC in this package measures Copilot's platform behaviour (the
  # Seatbelt profile, ~/Library/Caches/copilot, the DeveloperTools device id) —
  # discovery, not regression. The one macOS-shaped concern about our own code
  # is TCL-987's cwd spelling (/var/folders vs /private/var/folders), and that
  # is covered by pure unit tests in copilot_convstore_cwd_test.go and
  # copilot_dir_trust_test.go which need no CLI and already run in the macOS
  # `rest-all` shard above. The lab workflow still runs the macOS arm.
  #
  # It needs no GitHub credential and must never acquire one:
  # COPILOT_PROVIDER_BASE_URL activates Copilot's BYOK mode, which the CLI
  # documents as not requiring GitHub authentication, and the runner scrubs
  # every token variable from the child environment so a regression back into
  # an auth dependency fails here instead of passing on a logged-in machine.
  copilot-smoke:
    needs: changes
    if: needs.changes.outputs.run_copilot_smoke == 'true'
    name: Copilot CLI smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # This job runs `npm install --global` and then a third-party CLI.
          # Neither has any business seeing a persisted git credential, and the
          # job only needs the source tree.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node for the Copilot CLI
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Pinned HERE and nowhere else, the same way opencode-ai, @openai/codex
      # and @anthropic-ai/claude-code are pinned in the sandbox jobs above: a
      # workflow-level pin keeps an upstream publish from reddening unrelated
      # PRs, while a bump stays a one-line reviewable change. The scenarios
      # below assert BEHAVIOUR, not a recorded version, so they do not care
      # which release this is — which is what lets the pin live in one place
      # instead of being welded into the Go package.
      - name: Install the Copilot CLI
        shell: bash
        run: |
          npm install --global @github/copilot@1.0.77
          copilot --version

      # No bubblewrap provisioning: none of the scenarios below exercise
      # Copilot's own OS sandbox. That is the lab's subject, and the lab
      # workflow provisions the backend for it.
      #
      # -parallel 8 deliberately oversubscribes the runner's 4 vCPUs, and is
      # not a CPU bet. These scenarios are overwhelmingly IDLE: each launches a
      # CLI on a pseudo-terminal and then waits — for the screen to stop
      # redrawing, for a quiet window to close. Sized to cores, this job would
      # spend most of its wall clock with the runner parked.
      #
      # What makes the oversubscription safe is that no scenario classifies on
      # absolute time: every verdict is relative to the CLI's own output, and
      # the absolute deadlines are outer bounds set well above any observed
      # run. Contention stretches a scenario; it does not change what the
      # scenario concludes.
      - name: Copilot regression smoke
        shell: bash
        env:
          TCLAUDE_COPILOT_FIXTURE_SMOKE: "1"
        run: |
          set -o pipefail
          scenarios="$(grep -vE '^[[:space:]]*(#|$)' .github/copilot-smoke-scenarios.txt)"
          # An empty list would make `-run '^()$'` match nothing while the go
          # test invocation still exits 0, and the gate below would then have
          # nothing to require. Fail on the list itself instead.
          if [[ -z "$scenarios" ]]; then
            echo "::error::.github/copilot-smoke-scenarios.txt lists no scenarios"
            exit 1
          fi
          go test ./pkg/claude/harness/copilotfixture/... \
            -run "^($(echo "$scenarios" | paste -sd'|' -))$" \
            -v -count=1 -parallel 8 -timeout 600s 2>&1 \
            | tee "$RUNNER_TEMP/copilot-smoke.log"

      # A skipped test still exits 0. The gate is an env var, so a typo or a
      # rename would turn this job into a silent no-op that reports success
      # forever — assert that the real scenarios actually ran. The list is a
      # committed file rather than an inline array so that the -run filter
      # above and this gate cannot disagree; a scenario is added or removed in
      # exactly one place.
      - name: Reject a silently skipped smoke
        shell: bash
        run: |
          log="$RUNNER_TEMP/copilot-smoke.log"
          missing=()
          while read -r test_name; do
            grep -qE "^--- PASS: $test_name " "$log" || missing+=("$test_name")
          done < <(grep -vE '^[[:space:]]*(#|$)' .github/copilot-smoke-scenarios.txt)
          if (( ${#missing[@]} > 0 )); then
            {
              echo "### Copilot regression smoke did not run"
              echo
              echo "These scenarios did not report an explicit pass:"
              printf -- '- `%s`\n' "${missing[@]}"
              echo
              echo "The job installs the Copilot CLI and refuses a skipped or renamed test."
              echo "If a scenario was intentionally moved to the discovery lab, drop it from"
              echo '`.github/copilot-smoke-scenarios.txt` in the same change.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Copilot regression scenarios did not report an explicit pass: ${missing[*]}"
            exit 1
          fi


  # The real Gemini CLI against a loopback mock model (pkg/claude/harness/
  # geminifixture): tclaude's session reader, usage and what-if cost, séance
  # fork, hook install, folder trust and approval rendering, checked against
  # what the pinned binary actually writes and accepts. Credential-free.
  gemini-smoke:
    needs: changes
    if: needs.changes.outputs.run_gemini_smoke == 'true'
    name: Gemini CLI smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # This job runs `npm install --global` and then a third-party CLI.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node for the Gemini CLI
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Keep in step with harness.GeminiPinnedVersion and the filtered proxy
      # smoke's HARNESS_GEMINI_VERSION.
      - name: Install the Gemini CLI
        shell: bash
        run: |
          npm install --global @google/gemini-cli@0.62.0
          gemini --version

      - name: Gemini regression smoke
        shell: bash
        env:
          TCLAUDE_GEMINI_FIXTURE_SMOKE: "1"
        run: |
          set -o pipefail
          go test ./pkg/claude/harness/geminifixture/... -run '^TestGemini' \
            -v -count=1 -timeout 600s 2>&1 | tee "$RUNNER_TEMP/gemini-smoke.log"

      # A skipped test still exits 0, so require an explicit pass from every
      # scenario the package defines.
      - name: Reject a silently skipped smoke
        shell: bash
        run: |
          log="$RUNNER_TEMP/gemini-smoke.log"
          scenarios="$(go test -list '^TestGemini' ./pkg/claude/harness/geminifixture/ | grep '^Test' || true)"
          if [[ -z "$scenarios" ]]; then
            echo "::error::the Gemini fixture package defines no scenarios"
            exit 1
          fi
          missing=()
          while read -r test_name; do
            grep -qE "^--- PASS: $test_name " "$log" || missing+=("$test_name")
          done <<< "$scenarios"
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Gemini smoke scenarios did not report an explicit pass: ${missing[*]}"
            exit 1
          fi

  # Runs the real pi binary at harness.PiMinimumVersion against a local mock
  # provider, credential-free: tclaude's status extension must emit exactly the
  # payloads PiSim feeds the flow tests, and pi's session flags must behave as
  # the spawner assumes.
  pi-smoke:
    needs: changes
    if: needs.changes.outputs.run_pi_smoke == 'true'
    name: pi smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # This job runs `npm install --global` and then a third-party CLI.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node for pi
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # scripts/ci/pi pins pi and its whole dependency tree; keep it in step
      # with harness.PiMinimumVersion.
      - name: Install pi
        shell: bash
        run: scripts/ci/install-pi.sh

      - name: pi smoke
        shell: bash
        env:
          TCLAUDE_PI_FIXTURE_SMOKE: "1"
        run: |
          set -o pipefail
          go test ./pkg/claude/harness/pifixture/... -run '^TestPi' \
            -v -count=1 -timeout 600s 2>&1 | tee "$RUNNER_TEMP/pi-smoke.log"

      # A skipped test still exits 0, so require an explicit pass from every
      # scenario the package defines.
      - name: Reject a silently skipped smoke
        shell: bash
        run: |
          log="$RUNNER_TEMP/pi-smoke.log"
          scenarios="$(go test -list '^TestPi' ./pkg/claude/harness/pifixture/ | grep '^Test' || true)"
          if [[ -z "$scenarios" ]]; then
            echo "::error::the pi fixture package defines no scenarios"
            exit 1
          fi
          missing=()
          while read -r test_name; do
            grep -qE "^--- PASS: $test_name " "$log" || missing+=("$test_name")
          done <<< "$scenarios"
          if (( ${#missing[@]} > 0 )); then
            echo "::error::pi smoke scenarios did not report an explicit pass: ${missing[*]}"
            exit 1
          fi

  # The filtered-network proxy smokes build real sandboxes against live
  # fixtures. Everything that decides what runs, what counts as evidence, which
  # harness versions are pinned and how fixtures are built lives in
  # scripts/filtered-proxy-smoke/ — so extending the smokes is a repo change and
  # a review, not a workflow merge. Keep this job generic: if a change here is
  # ever needed to add a smoke, that belongs in the entrypoint instead.
  filtered-proxy-smoke:
    needs: changes
    if: needs.changes.outputs.run_filtered_proxy_smoke == 'true'
    uses: ./.github/workflows/reusable-filtered-proxy-smoke.yml

  # The end-to-end proxy-posture smokes verify the ASSEMBLED posture: authored
  # policy in, real launch, real enforcement observed, for each posture the
  # conditional-deployment table distinguishes — including the three that must
  # deploy no proxy. Everything that decides what runs and what counts as
  # evidence lives in scripts/proxy-posture-e2e/, so extending it is a repo
  # change and a review, not a workflow merge. Keep this job generic: if a
  # change here is ever needed to add a scenario, that belongs in the entrypoint
  # instead.
  proxy-posture-e2e:
    needs: changes
    if: needs.changes.outputs.run_proxy_posture_e2e == 'true'
    uses: ./.github/workflows/reusable-proxy-posture-e2e.yml

  # Require this gate in merge tooling: a skipped code job is never evidence
  # unless the classifier said, before anything ran, that it would be skipped.
  ci-complete:
    name: CI complete
    if: always()
    needs: [changes, docs, learn-commands, lint, sandbox-v2-smoke, sandbox-v2-seatbelt-smoke, test, copilot-smoke, gemini-smoke, pi-smoke, filtered-proxy-smoke, proxy-posture-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require the checks for this change
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          checks = json.loads(os.environ["NEEDS_JSON"])
          failures = []
          always = ("changes", "docs", "learn-commands")
          for name in always:
              if checks[name]["result"] != "success":
                  failures.append(f"{name}: {checks[name]['result']}, needs success")
          outputs = checks["changes"].get("outputs") or {}
          mode = outputs.get("mode")
          try:
              expected = json.loads(outputs.get("expected") or "")
          except ValueError:
              expected = None
          # Fail closed: without a well-formed verdict covering exactly the
          # gated jobs, no skip can be justified.
          gated = set(checks) - set(always)
          if mode not in ("docs", "ui", "code", "full"):
              failures.append(f"classifier mode is {mode!r}")
          if not isinstance(expected, dict) or set(expected) != gated or not all(
                  isinstance(v, bool) for v in expected.values()):
              failures.append(f"classifier verdict {expected!r} does not cover {sorted(gated)}")
              expected = {name: True for name in gated}
          if mode == "full" and not all(expected.values()):
              failures.append("a full run may not skip any job")
          for name in sorted(gated):
              want = "success" if expected[name] else "skipped"
              got = checks[name]["result"]
              print(f"{name}: {got} (expected {want})")
              if got != want:
                  failures.append(f"{name}: {got}, expected {want}")
          print(f"mode: {mode}")
          if failures:
              print("::error::" + "; ".join(failures))
              sys.exit(1)
          PY
