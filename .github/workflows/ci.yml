name: CI

on:
  pull_request:
    # main-codex is the long-lived harness-independence integration branch; gate
    # its increment PRs with the same CI as main. Drop it once main-codex→main lands.
    # implement-stable-agent-identity is the long-lived JOH-26 integration branch
    # (stable agent_id, decoupled from conv_id) — same deal; drop it once it→main lands.
    # dnd-palette is the long-lived drag-and-drop-palette integration branch
    # (JOH-374..377) — same deal; drop it once dnd-palette→main lands.
    branches: [main, main-codex, implement-stable-agent-identity, dnd-palette]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # golangci-lint is platform-independent, so run it once on a single runner
  # rather than duplicating it across the test matrix.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  sandbox-v2-smoke:
    name: Sandbox v2 bubblewrap smoke
    runs-on: ubuntu-latest
    steps:
      - name: Validate runner executable trust ancestry
        shell: bash
        run: |
          for component in / /usr /usr/lib; do
            owner_uid=$(stat -L -c '%u' "$component")
            if [[ "$owner_uid" != "0" ]]; then
              image_os=${ImageOS:-unknown}
              image_version=${ImageVersion:-unknown}
              warning="TCL-858 trust-walk prerequisite detected: path component \"$component\" is not root-owned (uid $owner_uid); Runner Image $image_os version $image_version; attempting non-recursive sudo chown root"
              echo "::warning title=Untrusted runner image::$warning"

              chown_status=0
              sudo chown root "$component" || chown_status=$?
              restat_status=0
              repaired_uid=$(stat -L -c '%u' "$component") || restat_status=$?
              {
                echo "### Runner executable trust prerequisite detected"
                echo
                echo "A runner-image path component failed the production executable trust requirement."
                echo
                echo "**Signature:** TCL-858 trust-walk prerequisite detected"
                echo
                printf '**Path component:** `%s`\n\n' "$component"
                printf '**Observed owner UID:** `%s`\n\n' "$owner_uid"
                printf '**Runner Image:** %s version %s\n\n' "$image_os" "$image_version"
                printf '**Remediation:** `sudo chown root %s` (non-recursive; exit %s)\n\n' "$component" "$chown_status"
                printf '**Owner re-check:** `%s` (stat exit %s)\n' "${repaired_uid:-unknown}" "$restat_status"
              } >> "$GITHUB_STEP_SUMMARY"

              if [[ "$chown_status" != "0" ||
                    "$restat_status" != "0" ||
                    "$repaired_uid" != "0" ]]; then
                error="TCL-858 trust-walk prerequisite failed: path component \"$component\" remains non-root-owned (uid ${repaired_uid:-unknown}) after non-recursive repair (sudo exit $chown_status, stat exit $restat_status); Runner Image $image_os version $image_version; sandbox v2 smoke was not run"
                echo "::error title=Untrusted runner image::$error"
                exit 1
              fi
            fi
          done

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node for OpenCode smoke
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Linux sandbox prerequisites
        shell: bash
        run: |
          source "$GITHUB_WORKSPACE/scripts/lib/smoke/common.sh"
          smoke::apt_update
          # Claude's embedded SRT discovers rg and socat at runtime; keep them
          # explicit so a runner-image change cannot turn the real nested smoke
          # into an accidental dependency check.
          sudo apt-get install --yes bubblewrap iproute2 nftables passt ripgrep socat
          # Ubuntu's packaged pasta predates the synthetic host-loopback
          # controls required by the filtered gateway. Build a reproducible
          # smoke prerequisite from the exact upstream release exercised here.
          git clone --quiet --depth 1 \
            --branch 2026_07_28.f8df3f1 \
            https://passt.top/passt \
            "$RUNNER_TEMP/passt"
          test "$(git -C "$RUNNER_TEMP/passt" rev-parse HEAD)" = \
            "f8df3f1b228fe19a74a269334fdfe6cc7d0605ce"
          make -C "$RUNNER_TEMP/passt" pasta
          # Install into a dedicated root-owned path: hosted runners
          # deliberately leave /usr/local/bin writable, which must fail the
          # production executable trust walk. A pasta-only prefix also avoids
          # shadowing the Actions-managed Go toolchain with /usr/bin/go.
          sudo install -d -o root -g root -m 0755 \
            /usr/lib/tclaude-filtered \
            /usr/lib/tclaude-filtered/bin
          sudo install -o root -g root -m 0755 \
            "$RUNNER_TEMP/passt/passt" /usr/lib/tclaude-filtered/bin/pasta
          # The hosted image also carries an older /usr/local/bin/pasta.
          # Prepend the secure dedicated path for this and all later steps, and
          # assert the same resolution the production prerequisite will use.
          echo "/usr/lib/tclaude-filtered/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/tclaude-filtered/bin:$PATH"
          test "$(command -v pasta)" = "/usr/lib/tclaude-filtered/bin/pasta"
          pasta --version

      - name: Install pinned OpenCode smoke binary
        run: |
          npm install --global opencode-ai@1.18.6
          opencode --version

      - name: Install pinned stacked sandbox engines
        shell: bash
        run: |
          npm install --global @openai/codex@0.145.0

          claude_version=2.1.220
          claude_platform=linux-x64
          claude_base_url=https://downloads.claude.ai/claude-code-releases
          claude_manifest="$RUNNER_TEMP/claude-manifest.json"
          claude_binary="$RUNNER_TEMP/claude-$claude_version"
          curl_args=(
            --fail
            --location
            --silent
            --show-error
            --max-time 60
            --retry 2
            --retry-all-errors
          )

          curl "${curl_args[@]}" \
            --output "$claude_manifest" \
            "$claude_base_url/$claude_version/manifest.json"
          claude_checksum=$(node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            process.stdout.write(manifest.platforms[process.argv[2]]?.checksum ?? "");
          ' "$claude_manifest" "$claude_platform")
          if [[ ! "$claude_checksum" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Missing Claude Code checksum for $claude_platform" >&2
            exit 1
          fi

          curl "${curl_args[@]}" \
            --output "$claude_binary" \
            "$claude_base_url/$claude_version/$claude_platform/claude"
          echo "$claude_checksum  $claude_binary" | sha256sum --check

          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/claude/versions"
          install -m 0755 \
            "$claude_binary" \
            "$HOME/.local/share/claude/versions/$claude_version"
          ln -sfn \
            "$HOME/.local/share/claude/versions/$claude_version" \
            "$HOME/.local/bin/claude"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version
          codex --version

      - name: Unlock and probe bubblewrap user namespace support
        shell: bash
        run: |
          restriction=kernel.apparmor_restrict_unprivileged_userns
          kernel=$(uname -a)

          set +e
          before=$(sysctl -n "$restriction" 2>&1)
          unlock_output=$(sudo sysctl -w "$restriction=0" 2>&1)
          unlock_status=$?
          after=$(sysctl -n "$restriction" 2>&1)
          readback_status=$?
          bwrap_output=$(bwrap --die-with-parent --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp -- true 2>&1)
          bwrap_status=$?
          set -e

          printf 'before: %s=%s\n' "$restriction" "$before"
          printf '%s\n' "$unlock_output"
          printf 'after: %s=%s\n' "$restriction" "$after"
          printf '%s\n' "$bwrap_output"
          printf 'bubblewrap exit code: %s\n' "$bwrap_status"

          if [ "$unlock_status" -ne 0 ] ||
             [ "$readback_status" -ne 0 ] ||
             [ "$after" != "0" ] ||
             [ "$bwrap_status" -ne 0 ]; then
            if [ -z "$bwrap_output" ]; then
              bwrap_output="<no output>"
            fi
            {
              echo "### Sandbox v2 bubblewrap smoke prerequisite failed"
              echo
              echo "The real bubblewrap smoke was not executed. The GitHub runner image or AppArmor policy likely changed."
              echo
              printf '**Image:** %s %s\n\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
              echo "**Kernel:**"
              echo '```text'
              printf '%s\n' "$kernel"
              echo '```'
              printf '**Sysctl before:** %s\n\n' "$before"
              printf '**Sysctl write exit code:** %s\n\n' "$unlock_status"
              echo "**Sysctl write output:**"
              echo '```text'
              printf '%s\n' "$unlock_output"
              echo '```'
              printf '**Sysctl after:** %s (read exit code %s)\n\n' "$after" "$readback_status"
              printf '**Bubblewrap exit code:** %s\n\n' "$bwrap_status"
              echo "**Bubblewrap output:**"
              echo '```text'
              printf '%s\n' "$bwrap_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::sandbox v2 bubblewrap smoke prerequisite failed; see the step summary for runner diagnostics"
            exit 1
          fi

      - name: Build tclaude for authenticated smoke
        run: go build -o "$RUNNER_TEMP/tclaude-sandbox-v2" .

      - name: Run bubblewrap platform assumptions
        env:
          TCLAUDE_SANDBOX_ASSUMPTIONS: "1"
        run: |
          assumption_log="$RUNNER_TEMP/bubblewrap-assumptions.log"
          go test ./pkg/claude/sandboxassumptions -run '^TestBubblewrapAssumptions$' -count=1 -v -timeout=180s |
            tee "$assumption_log"
          if ! grep -q '^--- PASS: TestBubblewrapAssumptions ' "$assumption_log"; then
            {
              echo "### Bubblewrap assumption suite did not complete"
              echo
              echo "The hardware-backed bubblewrap contract did not report an explicit pass."
              echo "A skip, missing/renamed test, build-tag mismatch, or zero-test success is a hard failure."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestBubblewrapAssumptions did not report an explicit pass"
            exit 1
          fi

      - name: Run sandbox v2 bubblewrap smoke
        env:
          TCLAUDE_SANDBOX_V2_SMOKE: "1"
          TCLAUDE_SANDBOX_V2_TCLAUDE_BINARY: ${{ runner.temp }}/tclaude-sandbox-v2
        run: |
          smoke_log="$RUNNER_TEMP/tclaude-layer-bubblewrap-smoke.log"
          go test ./pkg/claude/session -run '^TestTclaudeLayerHostSmoke$' -count=1 -v -timeout=180s |
            tee "$smoke_log"
          if ! grep -q '^--- PASS: TestTclaudeLayerHostSmoke ' "$smoke_log"; then
            {
              echo "### Sandbox v2 bubblewrap smoke did not complete"
              echo
              echo "The test command exited successfully without reporting that the named real smoke passed."
              echo "The test name, build constraints, or smoke gate likely changed; see the test log."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Sandbox v2 bubblewrap smoke did not report an explicit pass (TestTclaudeLayerHostSmoke)"
            exit 1
          fi
          if ! grep -qE '^ *--- PASS: TestTclaudeLayerHostSmoke/host-network-constructed-root ' "$smoke_log"; then
            {
              echo "### Sandbox v2 host-network constructed-root arm did not pass"
              echo
              echo "TCL-798's Linux socket capability under network=open rests on this arm's"
              echo "explicit pass. A skipped or renamed subtest is a hard failure."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestTclaudeLayerHostSmoke/host-network-constructed-root did not report an explicit pass"
            exit 1
          fi

      - name: Run filtered-network gateway smoke
        shell: bash
        env:
          TCLAUDE_FILTERED_NETWORK_SMOKE: "1"
          TCLAUDE_SANDBOX_V2_TCLAUDE_BINARY: ${{ runner.temp }}/tclaude-sandbox-v2
          TCLAUDE_FILTERED_ALLOWED_ADDR: 198.18.0.10
          TCLAUDE_FILTERED_ADJACENT_ADDR: 198.18.0.200
          TCLAUDE_FILTERED_ALLOWED_PREFIX: 198.18.0.0/25
          TCLAUDE_FILTERED_ALLOWED_ADDR6: "fd00:823::10"
          TCLAUDE_FILTERED_ADJACENT_ADDR6: "fd00:823::200"
          TCLAUDE_FILTERED_ALLOWED_PREFIX6: "fd00:823::/120"
          TCLAUDE_FILTERED_ALLOWED_PORT: "41001"
          TCLAUDE_FILTERED_DENIED_PORT: "41002"
          TCLAUDE_FILTERED_UDP_SOURCE_PORT: "20000"
        run: |
          namespace=tclaude-filtered-target
          host_link=tclflt0
          peer_link=tclflt1
          hosts_backup="$RUNNER_TEMP/tclaude-filtered-hosts.before"
          sudo cp /etc/hosts "$hosts_backup"
          # TCL-881: the same two teardown helpers the proxy shards use, from
          # the shared library, so every smoke job and the shards share one
          # implementation rather than copies that drift.
          source "$GITHUB_WORKSPACE/scripts/lib/smoke/common.sh"
          # smoke::kill_listener needs pkill (procps): without it the cleanup
          # would silently degrade to killing the sudo wrapper only, which is
          # the defect this job just fixed.
          command -v pkill >/dev/null || {
            echo "::error::pkill (procps) is required by the smoke fixture cleanup"
            exit 1
          }
          server_pids=()
          cleanup() {
            # smoke::kill_listener signals the socat itself and not only the
            # sudo wrapper holding it, which is what leaves a bound port behind.
            smoke::kill_listener "${server_pids[@]:-}"
            sudo ip netns del "$namespace" 2>/dev/null || true
            sudo ip link del "$host_link" 2>/dev/null || true
            sudo tee /etc/hosts <"$hosts_backup" >/dev/null || true
          }
          # EXIT alone would let a cancelled job — GitHub sends SIGINT first —
          # exit 0 with its fixture half torn down.
          smoke::trap_cleanup cleanup

          # pasta preserves a guest UDP flow's source port on its host-side
          # socket. Keep the smoke's source outside the host allocator's range,
          # and fail as a fixture error if a real listener already owns it.
          udp_source_port="$TCLAUDE_FILTERED_UDP_SOURCE_PORT"
          read -r ephemeral_low ephemeral_high \
            </proc/sys/net/ipv4/ip_local_port_range
          if (( udp_source_port >= ephemeral_low && udp_source_port <= ephemeral_high )); then
            echo "::error::Filtered-network UDP source port $udp_source_port is inside host ephemeral range $ephemeral_low-$ephemeral_high"
            exit 1
          fi
          if ss -H -lun "sport = :$udp_source_port" | grep -q .; then
            echo "::error::Filtered-network UDP source port $udp_source_port is already bound on the host"
            ss -H -lunp "sport = :$udp_source_port" || true
            exit 1
          fi

          sudo ip netns add "$namespace"
          sudo ip link add "$host_link" type veth peer name "$peer_link"
          sudo ip link set "$peer_link" netns "$namespace"
          sudo ip link set dev "$host_link" addrgenmode none
          sudo ip netns exec "$namespace" ip link set dev "$peer_link" addrgenmode none
          sudo ip link set "$host_link" up
          sudo ip address add 198.18.0.1/24 dev "$host_link"
          sudo ip -6 address add fe80::823:1/64 dev "$host_link" nodad
          sudo ip -6 address add fd00:823::1/64 dev "$host_link" nodad
          sudo ip netns exec "$namespace" ip link set lo up
          sudo ip netns exec "$namespace" ip link set "$peer_link" up
          sudo ip netns exec "$namespace" ip address add 198.18.0.10/24 dev "$peer_link"
          sudo ip netns exec "$namespace" ip address add 198.18.0.200/24 dev "$peer_link"
          sudo ip netns exec "$namespace" ip -6 address add fe80::823:2/64 dev "$peer_link" nodad
          sudo ip netns exec "$namespace" ip -6 address add fd00:823::10/64 dev "$peer_link" nodad
          sudo ip netns exec "$namespace" ip -6 address add fd00:823::200/64 dev "$peer_link" nodad
          {
            echo "198.18.0.200 exact-host.filtered.test sibling.filtered.test exact-domain.filtered.test child.exact-domain.filtered.test tree.filtered.test child.tree.filtered.test tree.filtered.test.attacker.invalid"
            echo "fd00:823::200 exact-host.filtered.test sibling.filtered.test exact-domain.filtered.test child.exact-domain.filtered.test tree.filtered.test child.tree.filtered.test tree.filtered.test.attacker.invalid"
          } | sudo tee -a /etc/hosts >/dev/null

          sudo ip -6 address show dev "$host_link"
          sudo ip -6 route show dev "$host_link"
          sudo ip netns exec "$namespace" ip -6 address show dev "$peer_link"
          sudo ip netns exec "$namespace" ip -6 route show dev "$peer_link"

          for address in 198.18.0.10 198.18.0.200; do
            for port in 41001 41002; do
              sudo ip netns exec "$namespace" \
                socat "TCP4-LISTEN:$port,bind=$address,reuseaddr,fork" EXEC:/bin/cat \
                >"$RUNNER_TEMP/filtered-tcp-$address-$port.log" 2>&1 &
              server_pids+=("$!")
              sudo ip netns exec "$namespace" \
                socat "UDP4-RECVFROM:$port,bind=$address,reuseaddr,fork" EXEC:/bin/cat \
                >"$RUNNER_TEMP/filtered-udp-$address-$port.log" 2>&1 &
              server_pids+=("$!")
            done
          done
          for address in fd00:823::10 fd00:823::200; do
            for port in 41001 41002; do
              sudo ip netns exec "$namespace" \
                socat "TCP6-LISTEN:$port,bind=[$address],ipv6only=1,reuseaddr,fork" EXEC:/bin/cat \
                >"$RUNNER_TEMP/filtered-tcp6-$address-$port.log" 2>&1 &
              server_pids+=("$!")
              sudo ip netns exec "$namespace" \
                socat "UDP6-RECVFROM:$port,bind=[$address],ipv6only=1,reuseaddr,fork" EXEC:/bin/cat \
                >"$RUNNER_TEMP/filtered-udp6-$address-$port.log" 2>&1 &
              server_pids+=("$!")
            done
          done
          sleep 1
          listener_dump=$(sudo ip netns exec "$namespace" ss -lntu6)
          printf '%s\n' "$listener_dump"
          for address in fd00:823::10 fd00:823::200; do
            for port in 41001 41002; do
              for protocol in tcp udp; do
                endpoint="[$address]:$port"
                if ! awk -v protocol="$protocol" -v endpoint="$endpoint" \
                  '$1 == protocol && $5 == endpoint { found = 1 } END { exit !found }' \
                  <<<"$listener_dump"; then
                  echo "::error::IPv6 filtered-network fixture failed to bind $protocol $endpoint"
                  exit 1
                fi
              done
            done
          done
          for protocol in TCP6 UDP6; do
            token="filtered-fixture-$protocol"
            # `|| true` inside the substitution, exactly as
            # fixture::prove_reachable does it: under `set -e -o pipefail` a
            # socat that fails — the very case this checks — would abort the
            # step here, so the annotation below could never be reached.
            reply=$(
              printf '%s' "$token" |
                timeout 5 socat -T 2 -t 2 - "$protocol:[fd00:823::10]:41001" || true
            )
            if [[ "$reply" != "$token" ]]; then
              echo "::error::IPv6 filtered-network fixture failed direct $protocol round trip"
              exit 1
            fi
          done

          smoke_log="$RUNNER_TEMP/tclaude-filtered-network-smoke.log"
          go test ./pkg/claude/session \
            -run '^TestTclaudeLayerFilteredNetwork(DNS)?(Deny)?Smoke$' \
            -count=1 -v -timeout=180s |
            tee "$smoke_log"
          if ! grep -q '^--- PASS: TestTclaudeLayerFilteredNetworkSmoke ' "$smoke_log"; then
            {
              echo "### Filtered-network gateway smoke did not complete"
              echo
              echo "The named real boundary did not report an explicit pass."
              echo "A skip, missing/renamed test, build-tag mismatch, or zero-test success is a hard failure."
              echo "The smoke must execute IPv4/IPv6 CIDR+port TCP+UDP allow and deny cases, synthetic host loopback, capability drop, and fail-closed pasta teardown."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestTclaudeLayerFilteredNetworkSmoke did not report an explicit pass"
            exit 1
          fi
          if ! grep -q '^--- PASS: TestTclaudeLayerFilteredNetworkDNSSmoke ' "$smoke_log"; then
            {
              echo "### Filtered-network DNS boundary smoke did not complete"
              echo
              echo "The named M2c boundary did not report an explicit pass."
              echo "A skip, missing/renamed test, build-tag mismatch, or zero-test success is a hard failure."
              echo "The smoke must execute exact host/domain/subdomain and suffix-deny cases, shared-IP reuse, TTL expiry, fresh-answer refresh, and established-flow continuation for both Claude and Codex tclaude-layer launches."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestTclaudeLayerFilteredNetworkDNSSmoke did not report an explicit pass"
            exit 1
          fi
          if ! grep -q '^--- PASS: TestTclaudeLayerFilteredNetworkDenySmoke ' "$smoke_log"; then
            {
              echo "### Filtered-network deny boundary smoke did not complete"
              echo
              echo "The named deny boundary did not report an explicit pass."
              echo "A skip, missing/renamed test, build-tag mismatch, or zero-test success is a hard failure."
              echo "The smoke must execute deny-wins CIDR overlap and port cases for IPv4/IPv6 TCP+UDP across Claude and Codex tclaude-layer launches, plus fail-closed teardown."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestTclaudeLayerFilteredNetworkDenySmoke did not report an explicit pass"
            exit 1
          fi
          if ! grep -q '^--- PASS: TestTclaudeLayerFilteredNetworkDNSDenySmoke ' "$smoke_log"; then
            {
              echo "### Filtered-network DNS deny boundary smoke did not complete"
              echo
              echo "The named DNS deny boundary did not report an explicit pass."
              echo "A skip, missing/renamed test, build-tag mismatch, or zero-test success is a hard failure."
              echo "The smoke must execute deny-wins name/port/shared-IP cases, negative TTL expiry and refresh, and established-TCP cuts across Claude and Codex tclaude-layer launches."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestTclaudeLayerFilteredNetworkDNSDenySmoke did not report an explicit pass"
            exit 1
          fi

      - name: Run pinned filtered model endpoint evidence
        env:
          TCLAUDE_FILTERED_MODEL_ENDPOINT_SMOKE: "1"
        run: |
          smoke_log="$RUNNER_TEMP/tclaude-filtered-model-endpoints.log"
          go test ./pkg/claude/session \
            -run '^TestPinnedFilteredModelEndpointEvidence$' \
            -count=1 -v -timeout=60s |
            tee "$smoke_log"
          if ! grep -q '^--- PASS: TestPinnedFilteredModelEndpointEvidence ' "$smoke_log"; then
            {
              echo "### Pinned filtered model endpoint evidence did not complete"
              echo
              echo "The named real Claude/Codex origin audit did not report an explicit pass."
              echo "A skip, missing/renamed test, version drift, or zero-test success is a hard failure."
              echo "The smoke must execute Claude 2.1.220 API-key traffic and Codex 0.145.0 API-key, ChatGPT, and token-refresh traffic, refusing every undeclared origin."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestPinnedFilteredModelEndpointEvidence did not report an explicit pass"
            exit 1
          fi

      - name: Run pinned Codex effective-config seam evidence
        env:
          TCLAUDE_FILTERED_MODEL_ENDPOINT_SMOKE: "1"
        run: |
          smoke_log="$RUNNER_TEMP/tclaude-codex-effective-config.log"
          go test ./pkg/claude/session \
            -run '^TestPinnedCodexEffectiveConfigSeam$' \
            -count=1 -v -timeout=120s |
            tee "$smoke_log"
          if ! grep -q '^--- PASS: TestPinnedCodexEffectiveConfigSeam ' "$smoke_log"; then
            {
              echo "### Pinned Codex effective-config seam evidence did not complete"
              echo
              echo "The named real Codex effective-config read did not report an explicit pass."
              echo "A skip, missing/renamed test, version drift, or zero-test success is a hard failure."
              echo "The smoke must resolve provider routing through Codex 0.145.0's own app-server config/read, including its layer precedence."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestPinnedCodexEffectiveConfigSeam did not report an explicit pass"
            exit 1
          fi

      - name: Run pinned Codex system-config layer evidence
        env:
          TCLAUDE_CODEX_SYSTEM_LAYER_SMOKE: "1"
        run: |
          # Machine-wide, so it is staged here and removed immediately after —
          # every other pinned-harness step has already run by this point and
          # must not inherit this routing override.
          sudo mkdir -p /etc/codex
          printf 'openai_base_url = "https://system-layer.example/v1"\n' |
            sudo tee /etc/codex/config.toml >/dev/null
          smoke_log="$RUNNER_TEMP/tclaude-codex-system-layer.log"
          set +e
          go test ./pkg/claude/session \
            -run '^TestPinnedCodexSystemConfigLayerEvidence$' \
            -count=1 -v -timeout=120s |
            tee "$smoke_log"
          status=${PIPESTATUS[0]}
          set -e
          sudo rm -f /etc/codex/config.toml
          if [ "$status" -ne 0 ] ||
             ! grep -q '^--- PASS: TestPinnedCodexSystemConfigLayerEvidence ' "$smoke_log"; then
            {
              echo "### Pinned Codex system-config layer evidence did not complete"
              echo
              echo "The launch seam no longer refuses an external /etc/codex provider override; it relies on Codex's own merge including the system layer."
              echo "This step is the evidence for that removed refusal. A skip, missing/renamed test, version drift, or zero-test success is a hard failure."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestPinnedCodexSystemConfigLayerEvidence did not report an explicit pass"
            exit 1
          fi

      - name: Run OpenCode executor sandbox smoke
        env:
          TCLAUDE_OPENCODE_LAYER_SMOKE: "1"
          TCLAUDE_SANDBOX_V2_TCLAUDE_BINARY: ${{ runner.temp }}/tclaude-sandbox-v2
        run: |
          smoke_log="$RUNNER_TEMP/opencode-tclaude-layer-smoke.log"
          go test ./pkg/claude/agentd -run '^TestOpenCodeTclaudeLayerExecutorSmoke$' -count=1 -v -timeout=120s |
            tee "$smoke_log"
          if ! grep -q '^--- PASS: TestOpenCodeTclaudeLayerExecutorSmoke ' "$smoke_log"; then
            {
              echo "### OpenCode executor sandbox smoke did not complete"
              echo
              echo "The real OpenCode serve/attach/tool/identity smoke did not report an explicit pass."
              echo "The job provisions a pinned OpenCode binary and uses the same AppArmor userns unlock as the sandbox v2 host smoke."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestOpenCodeTclaudeLayerExecutorSmoke did not report an explicit pass"
            exit 1
          fi

      - name: Run OpenCode filtered-network activation smoke
        shell: bash
        env:
          TCLAUDE_OPENCODE_LAYER_SMOKE: "1"
          TCLAUDE_SANDBOX_V2_TCLAUDE_BINARY: ${{ runner.temp }}/tclaude-sandbox-v2
          TCLAUDE_FILTERED_ALLOWED_ADDR: 198.18.1.10
          TCLAUDE_FILTERED_ADJACENT_ADDR: 198.18.1.200
          TCLAUDE_FILTERED_ALLOWED_ADDR6: "fd00:824::10"
          TCLAUDE_FILTERED_ADJACENT_ADDR6: "fd00:824::200"
          TCLAUDE_FILTERED_ALLOWED_PREFIX6: "fd00:824::/120"
          TCLAUDE_FILTERED_ALLOWED_PORT: "41001"
          TCLAUDE_FILTERED_DENIED_PORT: "41002"
        run: |
          # The deny cases need live adjacent targets and resolvable names. The
          # gateway smoke's own fixture is torn down with its step, so this
          # boundary provisions an independent namespace on its own subnet.
          namespace=tclaude-opencode-deny-target
          host_link=tclocd0
          peer_link=tclocd1
          hosts_backup="$RUNNER_TEMP/tclaude-opencode-deny-hosts.before"
          sudo cp /etc/hosts "$hosts_backup"
          # TCL-881: the same two teardown helpers the proxy shards use, from
          # the shared library, so every smoke job and the shards share one
          # implementation rather than copies that drift.
          source "$GITHUB_WORKSPACE/scripts/lib/smoke/common.sh"
          # smoke::kill_listener needs pkill (procps): without it the cleanup
          # would silently degrade to killing the sudo wrapper only, which is
          # the defect this job just fixed.
          command -v pkill >/dev/null || {
            echo "::error::pkill (procps) is required by the smoke fixture cleanup"
            exit 1
          }
          server_pids=()
          cleanup() {
            # smoke::kill_listener signals the socat itself and not only the
            # sudo wrapper holding it, which is what leaves a bound port behind.
            smoke::kill_listener "${server_pids[@]:-}"
            sudo ip netns del "$namespace" 2>/dev/null || true
            sudo ip link del "$host_link" 2>/dev/null || true
            sudo tee /etc/hosts <"$hosts_backup" >/dev/null || true
          }
          # EXIT alone would let a cancelled job — GitHub sends SIGINT first —
          # exit 0 with its fixture half torn down.
          smoke::trap_cleanup cleanup

          sudo ip netns add "$namespace"
          sudo ip link add "$host_link" type veth peer name "$peer_link"
          sudo ip link set "$peer_link" netns "$namespace"
          sudo ip link set dev "$host_link" addrgenmode none
          sudo ip netns exec "$namespace" ip link set dev "$peer_link" addrgenmode none
          sudo ip link set "$host_link" up
          sudo ip address add 198.18.1.1/24 dev "$host_link"
          sudo ip -6 address add fe80::824:1/64 dev "$host_link" nodad
          sudo ip -6 address add fd00:824::1/64 dev "$host_link" nodad
          sudo ip netns exec "$namespace" ip link set lo up
          sudo ip netns exec "$namespace" ip link set "$peer_link" up
          sudo ip netns exec "$namespace" ip address add 198.18.1.10/24 dev "$peer_link"
          sudo ip netns exec "$namespace" ip address add 198.18.1.200/24 dev "$peer_link"
          sudo ip netns exec "$namespace" ip -6 address add fe80::824:2/64 dev "$peer_link" nodad
          sudo ip netns exec "$namespace" ip -6 address add fd00:824::10/64 dev "$peer_link" nodad
          sudo ip netns exec "$namespace" ip -6 address add fd00:824::200/64 dev "$peer_link" nodad
          # Both names share the adjacent address on purpose: the DNS deny case
          # proves a negative lease cuts an address an allowed name also uses.
          {
            echo "198.18.1.200 oc-exact-host.filtered.test oc-sibling.filtered.test"
            echo "fd00:824::200 oc-exact-host.filtered.test oc-sibling.filtered.test"
          } | sudo tee -a /etc/hosts >/dev/null

          for address in 198.18.1.10 198.18.1.200; do
            for port in 41001 41002; do
              sudo ip netns exec "$namespace" \
                socat "TCP4-LISTEN:$port,bind=$address,reuseaddr,fork" EXEC:/bin/cat \
                >"$RUNNER_TEMP/opencode-deny-tcp-$address-$port.log" 2>&1 &
              server_pids+=("$!")
              sudo ip netns exec "$namespace" \
                socat "UDP4-RECVFROM:$port,bind=$address,reuseaddr,fork" EXEC:/bin/cat \
                >"$RUNNER_TEMP/opencode-deny-udp-$address-$port.log" 2>&1 &
              server_pids+=("$!")
            done
          done
          for address in fd00:824::10 fd00:824::200; do
            for port in 41001 41002; do
              sudo ip netns exec "$namespace" \
                socat "TCP6-LISTEN:$port,bind=[$address],ipv6only=1,reuseaddr,fork" EXEC:/bin/cat \
                >"$RUNNER_TEMP/opencode-deny-tcp6-$address-$port.log" 2>&1 &
              server_pids+=("$!")
              sudo ip netns exec "$namespace" \
                socat "UDP6-RECVFROM:$port,bind=[$address],ipv6only=1,reuseaddr,fork" EXEC:/bin/cat \
                >"$RUNNER_TEMP/opencode-deny-udp6-$address-$port.log" 2>&1 &
              server_pids+=("$!")
            done
          done
          sleep 1
          listener_dump=$(sudo ip netns exec "$namespace" ss -lntu)
          printf '%s\n' "$listener_dump"
          for endpoint in 198.18.1.10:41001 198.18.1.10:41002 \
            198.18.1.200:41001 198.18.1.200:41002 \
            "[fd00:824::10]:41001" "[fd00:824::10]:41002" \
            "[fd00:824::200]:41001" "[fd00:824::200]:41002"; do
            for protocol in tcp udp; do
              if ! awk -v protocol="$protocol" -v endpoint="$endpoint" \
                '$1 == protocol && $5 == endpoint { found = 1 } END { exit !found }' \
                <<<"$listener_dump"; then
                echo "::error::OpenCode deny fixture failed to bind $protocol $endpoint"
                exit 1
              fi
            done
          done

          # Prove the fixture is reachable from the host before the smoke runs,
          # so a routing fault reads as a fixture error rather than an opaque
          # deny-probe failure inside the sandbox.
          for endpoint in "TCP4:198.18.1.10:41001" "TCP6:[fd00:824::10]:41001"; do
            token="opencode-deny-fixture-$endpoint"
            # Tolerate a failing round trip here: the explicit check below is
            # the diagnostic, not the shell's -e abort.
            reply=$(printf '%s' "$token" | timeout 5 socat -T 2 -t 2 - "$endpoint" || true)
            if [[ "$reply" != "$token" ]]; then
              echo "::error::OpenCode deny fixture failed a direct round trip to $endpoint"
              exit 1
            fi
          done

          smoke_log="$RUNNER_TEMP/opencode-filtered-network-smoke.log"
          go test ./pkg/claude/agentd -run '^TestOpenCodeFilteredNetworkExecutorSmoke$' -count=1 -v -timeout=240s |
            tee "$smoke_log"
          if ! grep -q '^--- PASS: TestOpenCodeFilteredNetworkExecutorSmoke ' "$smoke_log"; then
            {
              echo "### OpenCode filtered-network activation smoke did not complete"
              echo
              echo "The pinned real OpenCode explicit-provider and packet-boundary proof did not report an explicit pass."
              echo "A skip, missing/renamed test, config-isolation regression, or zero-test success is a hard failure."
              echo "The smoke must prove the executing server consumes only the inspected provider route, then allow authored model/TCP/UDP traffic, deny an unauthorised port, and enforce deny-wins overlap in both directions plus the DNS negative-lease cut."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestOpenCodeFilteredNetworkExecutorSmoke did not report an explicit pass"
            exit 1
          fi
          if ! grep -q 'opencode-filtered-deny-helper PASS' "$smoke_log"; then
            {
              echo "### OpenCode filtered-network deny boundary did not execute"
              echo
              echo "The smoke passed without the real bash tool reporting the deny probes."
              echo "The OpenCode deny capability cell claims enforcement only while this marker is produced by an executed run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::OpenCode filtered-network deny probes did not execute"
            exit 1
          fi

      - name: Run stacked real-engine smoke
        env:
          TCLAUDE_STACKED_SANDBOX_SMOKE: "1"
          TCLAUDE_SANDBOX_V2_TCLAUDE_BINARY: ${{ runner.temp }}/tclaude-sandbox-v2
        run: |
          smoke_log="$RUNNER_TEMP/stacked-sandbox-smoke.log"
          go test ./pkg/claude/session -run '^TestStackedSandboxHostSmoke$' -count=1 -v -timeout=180s |
            tee "$smoke_log"
          if ! grep -q '^--- PASS: TestStackedSandboxHostSmoke ' "$smoke_log"; then
            {
              echo "### Stacked sandbox smoke did not complete"
              echo
              echo "The exact Claude embedded-SRT/Codex nested-engine matrix did not report an explicit pass."
              echo "Both host-open and isolated tclaude outer postures are hard requirements."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestStackedSandboxHostSmoke did not report an explicit pass"
            exit 1
          fi

  sandbox-v2-seatbelt-smoke:
    name: Sandbox v2 Seatbelt smoke
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node for OpenCode smoke
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Keep this deliberately aligned with the Linux executor smoke. A pin
      # bump changes the exercised upstream tool/server contract and must be a
      # reviewed source change, never runner-image drift.
      - name: Install pinned OpenCode smoke binary
        run: |
          npm install --global opencode-ai@1.18.6
          opencode --version

      - name: Install pinned proxy-cooperation harnesses
        run: |
          npm install --global \
            @anthropic-ai/claude-code@2.1.220 \
            @openai/codex@0.145.0
          claude --version | grep -qF '2.1.220'
          codex --version | grep -qF '0.145.0'

      - name: Probe Seatbelt deny-write support
        shell: bash
        run: |
          probe="$RUNNER_TEMP/tclaude-seatbelt-probe"
          rm -f "$probe"
          profile='(version 1)
          (allow default)
          (deny file-write* (literal (param "TCLAUDE_PROBE")))'
          kernel=$(uname -a)
          macos=$(sw_vers)

          set +e
          probe_output=$(TCLAUDE_PROBE="$probe" /usr/bin/sandbox-exec \
            -p "$profile" "-DTCLAUDE_PROBE=$probe" -- /bin/sh -c \
            'test ! -e "$TCLAUDE_PROBE" && ! touch "$TCLAUDE_PROBE"' 2>&1)
          probe_status=$?
          set -e

          if [ -e "$probe" ]; then
            probe_created=yes
          else
            probe_created=no
          fi
          rm -f "$probe"

          printf '%s\n' "$probe_output"
          printf 'Seatbelt probe exit code: %s\n' "$probe_status"
          printf 'Probe path created: %s\n' "$probe_created"

          if [ "$probe_status" -ne 0 ] || [ "$probe_created" != "no" ]; then
            if [ -z "$probe_output" ]; then
              probe_output="<no output>"
            fi
            {
              echo "### Sandbox v2 Seatbelt smoke prerequisite failed"
              echo
              echo "The real Darwin smoke was not executed. The GitHub runner image or Seatbelt policy likely changed."
              echo
              echo "**macOS:**"
              echo '```text'
              printf '%s\n' "$macos"
              echo '```'
              echo "**Kernel:**"
              echo '```text'
              printf '%s\n' "$kernel"
              echo '```'
              printf '**Seatbelt probe exit code:** %s\n\n' "$probe_status"
              printf '**Probe path created:** %s\n\n' "$probe_created"
              echo "**Seatbelt probe output:**"
              echo '```text'
              printf '%s\n' "$probe_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::sandbox v2 Seatbelt smoke prerequisite failed; see the step summary for runner diagnostics"
            exit 1
          fi

      - name: Build tclaude for authenticated smoke
        run: go build -o "$RUNNER_TEMP/tclaude-sandbox-v2" .

      - name: Run Seatbelt platform assumptions
        env:
          TCLAUDE_SANDBOX_ASSUMPTIONS: "1"
        run: |
          assumption_log="$RUNNER_TEMP/seatbelt-assumptions.log"
          go test ./pkg/claude/sandboxassumptions -run '^TestSeatbeltAssumptions$' -count=1 -v -timeout=180s |
            tee "$assumption_log"
          if ! grep -q '^--- PASS: TestSeatbeltAssumptions ' "$assumption_log"; then
            {
              echo "### Seatbelt assumption suite did not complete"
              echo
              echo "The hardware-backed Seatbelt contract did not report an explicit pass."
              echo "A skip, missing/renamed test, build-tag mismatch, or zero-test success is a hard failure."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestSeatbeltAssumptions did not report an explicit pass"
            exit 1
          fi

      - name: Run sandbox v2 Seatbelt smoke
        env:
          TCLAUDE_SANDBOX_V2_SMOKE: "1"
          TCLAUDE_OPENCODE_PROXY_DARWIN_SMOKE: "1"
          TCLAUDE_SANDBOX_V2_TCLAUDE_BINARY: ${{ runner.temp }}/tclaude-sandbox-v2
        run: |
          driver_log="$RUNNER_TEMP/seatbelt-smoke-driver.log"
          set +e
          bash scripts/seatbelt-smoke/driver.sh | tee "$driver_log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          if [[ "${pipeline_status[0]}" -ne 0 || "${pipeline_status[1]}" -ne 0 ]]; then
            echo "::error::seatbelt driver pipeline failed (driver=${pipeline_status[0]}, tee=${pipeline_status[1]})"
            exit 1
          fi
          if ! grep -q '^Seatbelt smoke evidence complete:$' "$driver_log"; then
            echo "::error::seatbelt driver did not print its completion sentinel — it exited before finishing"
            exit 1
          fi

      - name: Run OpenCode Seatbelt executor smoke
        env:
          TCLAUDE_OPENCODE_LAYER_SMOKE: "1"
          TCLAUDE_SANDBOX_V2_TCLAUDE_BINARY: ${{ runner.temp }}/tclaude-sandbox-v2
        run: |
          smoke_log="$RUNNER_TEMP/opencode-tclaude-layer-darwin-smoke.log"
          go test ./pkg/claude/agentd -run '^TestOpenCodeTclaudeLayerDarwinExecutorSmoke$' -count=1 -v -timeout=120s |
            tee "$smoke_log"
          if ! grep -q '^--- PASS: TestOpenCodeTclaudeLayerDarwinExecutorSmoke ' "$smoke_log"; then
            {
              echo "### OpenCode Seatbelt executor smoke did not complete"
              echo
              echo "The real OpenCode serve/attach/tool/identity smoke did not report an explicit pass."
              echo "The job provisions pinned opencode-ai@1.18.6 and refuses a skipped or renamed test."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TestOpenCodeTclaudeLayerDarwinExecutorSmoke did not report an explicit pass"
            exit 1
          fi

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      # One red shard must not cancel its siblings — the point of sharding is
      # seeing exactly which slice fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The suite is sharded across concurrent runners so the wall clock is
        # bounded by the slowest single package instead of the sum. The shard
        # partition itself (and the rationale for each slice) lives in the
        # shared .github/actions/test-suite action, which the release
        # workflows consume with the same split — keep the shard list here in
        # sync with the case statement there.
        shard: [agentd, jstest, process, sandbox, rest]
        exclude:
          # PR CI skips macOS jstest: the shard exercises browser-targeted
          # dashboard JS under Node + the vendored LinkeDOM runtime, so
          # nothing in it varies by runner OS (end-user browsers are a
          # different axis entirely) and one Linux run is full PR coverage.
          # macOS still covers this shard post-merge: release.yml's gating
          # Test job runs the same shard matrix without this exclusion.
          # Residual PR-side gap, accepted knowingly: the Go wrapper in
          # pkg/claude/agentd/jstest itself never builds/runs on darwin
          # before merge, so a darwin-only break there would surface in
          # release.yml (blocking releases) rather than bouncing the
          # offending PR. The Go shards run on both OSes — they carry
          # _unix/_darwin build-tagged code and real fs behavior.
          - os: macos-latest
            shard: jstest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The Go race detector is OFF by default and gated behind the RUN_RACE
      # repository variable (Settings -> Secrets and variables -> Actions ->
      # Variables -> RUN_RACE=true) so it can be enabled later without a code
      # change. It roughly triples the test step's wall-clock, which is why it
      # is opt-in. The suite is race-clean as of this writing, so flipping the
      # variable is safe. -race needs CGO, which the ubuntu/macOS runners have
      # on by default.
      - name: Test suite (${{ matrix.shard }})
        uses: ./.github/actions/test-suite
        with:
          shard: ${{ matrix.shard }}
          race: ${{ vars.RUN_RACE }}

  # Credential-free GitHub Copilot CLI compatibility fixtures (TCL-970).
  #
  # This job runs the REAL pinned Copilot CLI against a deterministic localhost
  # mock provider. It needs no GitHub credential and must never acquire one:
  # COPILOT_PROVIDER_BASE_URL activates Copilot's BYOK mode, which the CLI
  # documents as not requiring GitHub authentication, and the runner scrubs
  # every token variable from the child environment so a regression back into
  # an auth dependency fails here instead of passing on a logged-in machine.
  #
  # Two platforms, with DIFFERENT scopes, and the asymmetry is deliberate.
  #
  # The compatibility evidence (wire shape, session layout, exit codes, event
  # stream) is not OS-specific, so running all of it twice would buy a duplicate
  # answer at double the cost — that was the original Linux-only rationale and it
  # still holds. What IS OS-specific is anything touching a security boundary or
  # a platform path:
  #
  #   - Copilot's own sandbox (TCL-977): bubblewrap on Linux, Seatbelt on macOS,
  #     and a finding about one kernel is not a finding about the other.
  #   - tclaude's outer layer (TCL-978): the baseline's package cache moves to
  #     ~/Library/Caches/copilot on macOS and the device-id file to
  #     ~/Library/Application Support/Microsoft/DeveloperTools — two different
  #     Library trees, neither XDG-shaped. That last one was DISCOVERED by this
  #     macOS arm refuting the catalog's original claim, which is the whole
  #     argument for the arm existing.
  #
  # So macOS runs the sandbox and platform scenarios from both tickets, and
  # skips the wire ones.
  copilot-fixtures:
    name: Copilot CLI fixtures (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            # Everything: the compatibility fixtures and the sandbox ones.
            run_filter: TestCopilot
          - platform: macos
            runner: macos-latest
            # The Seatbelt half of TCL-977's evidence, plus TCL-978's platform
            # and assert-off scenarios. The descriptor test TCL-977's
            # measurements justify needs no CLI and lives in the harness
            # package, so the ordinary `go test ./...` job owns it.
            #
            # TCL-987's cwd-spelling scenario is macOS-ONLY by nature: it needs a
            # runner whose $TMPDIR is spelled /var/folders/… while the kernel's
            # directory is /private/var/folders/…, which is the entire defect. On
            # Linux it has no alternate spelling to supply and skips, so this arm
            # is the only place it is real evidence.
            run_filter: TestCopilotNativeSandbox|TestCopilotSandboxBaseline|TestCopilotDefaultCachePlacement|TestCopilotPackageCacheIsExecutable|TestCopilotInnerSandbox|TestCopilotLegacyConfig|TestCopilotStartupDialsOnlyContractedHosts|TestCopilotConvStoreMatchesTheUnresolvedCwdSpelling|TestCopilotPermissionPathGrants|TestCopilotDirTrust
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # This job runs `npm install --global` and then a third-party CLI.
          # Neither has any business seeing a persisted git credential, and the
          # job only needs the source tree.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node for the Copilot CLI
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pinned Copilot CLI
        shell: bash
        run: |
          # The version is pinned in pkg/claude/harness/copilotfixture/version.go
          # and re-asserted by the test itself, so an install drift cannot pass
          # silently. Keep the two in sync when bumping.
          npm install --global @github/copilot@1.0.77
          copilot --version

      # Copilot's Linux sandbox backend is bubblewrap, and the native-sandbox
      # scenarios assert real enforcement wherever it can start. Provisioning it
      # here is what keeps the ENFORCING arm running instead of the fail-closed
      # one: `bwrap` on PATH is not sufficient, the kernel must also permit an
      # unprivileged user namespace, which Ubuntu's AppArmor restricts by
      # default. Relaxing it on an ephemeral runner is safe and is verified
      # below rather than assumed.
      - name: Provision the Linux sandbox backend
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          source "$GITHUB_WORKSPACE/scripts/lib/smoke/common.sh"
          smoke::apt_update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --proc /proc --dev /dev true \
            && echo "bwrap can create a namespace" \
            || echo "::warning::bwrap cannot create a namespace; the enforcing arm will not run"

      # -parallel 8 deliberately oversubscribes the runner's 4 vCPUs, and is
      # not a CPU bet. These scenarios are overwhelmingly IDLE: each launches a
      # CLI on a pseudo-terminal and then waits — for the screen to stop
      # redrawing, for a quiet window to close, for a prompt nobody will ever
      # answer. Sized to cores, this job spent most of ten minutes with the
      # runner parked.
      #
      # What makes the oversubscription safe is that no scenario classifies on
      # absolute time: every verdict is relative to the CLI's own output — it
      # settled when its evidence arrived, it is blocked when its transcript
      # stood still — and the absolute deadlines are outer bounds set well
      # above any observed run. Contention stretches a scenario; it does not
      # change what the scenario concludes.
      #
      # 2x is what was VERIFIED, not assumed: the suite was run green under a
      # deliberately harsher budget — pinned to two cores at -parallel 4, the
      # same 2x ratio this line asks of a four-core runner — and the timing
      # constants (blockedQuiet in particular) were sized from the output gaps
      # that run produced. The scenarios that could not take it are sequential
      # and say why: see requireSmokeParallel, requireSmokeGolden, and the
      # PTY TIMING lines in this job's own log, which are what a future
      # re-tuning should argue from.
      - name: Copilot fixture smoke
        shell: bash
        env:
          TCLAUDE_COPILOT_FIXTURE_SMOKE: "1"
        run: |
          set -o pipefail
          go test ./pkg/claude/harness/copilotfixture/... \
            -run '${{ matrix.run_filter }}' -v -count=1 -parallel 8 -timeout 1500s 2>&1 | tee "$RUNNER_TEMP/copilot-fixtures.log"

      # A skipped test still exits 0. The gate is an env var, so a typo or a
      # rename would turn this job into a silent no-op that reports success
      # forever — assert that the real scenarios actually ran.
      - name: Reject a silently skipped smoke
        shell: bash
        run: |
          log="$RUNNER_TEMP/copilot-fixtures.log"
          # TCL-977's sandbox scenarios are required on BOTH platforms: they are
          # the evidence behind a security capability decision, and a boundary
          # measured only on Linux says nothing about Seatbelt.
          required=(
            TestCopilotNativeSandboxBuiltinEditsAreInProcessOnly
            TestCopilotNativeSandboxBuiltinEditPolicyResolvesSymlinksAndTraversal
            TestCopilotNativeSandboxShellEnforcementIsHostConditional
            TestCopilotNativeSandboxShellBasePolicySurface
            TestCopilotNativeSandboxNeedsNoExperimentalFlag
            TestCopilotNativeSandboxDisabledAppliesNoPolicy
            TestCopilotNativeSandboxSettingsSourcesAndPrecedence
            # TCL-978's outer-layer evidence, required on both arms for the same
            # reason: the macOS acceptance criteria are a real package cache
            # under ~/Library/Caches/copilot, a device id under
            # ~/Library/Application Support/Microsoft/DeveloperTools (NOT
            # XDG-shaped — this arm refuted that), and executable access to the
            # package cache. A silent skip would report the platform contract as
            # proven when nothing ran.
            TestCopilotSandboxBaselineCoversObservedWrites
            TestCopilotDefaultCachePlacementMatchesBaseline
            TestCopilotPackageCacheIsExecutable
            TestCopilotInnerSandboxDefaultIsOff
            TestCopilotInnerSandboxEnabledIsDetectedBeforeLaunch
            # The assert-off gate reads TWO settings files and the legacy one
            # wins, replacing whole top-level keys. These tie that precedence
            # claim to the real binary; if the CLI ever stops migrating, the
            # gate is inspecting the wrong file and this must fail rather than
            # the gate silently going soft.
            TestCopilotLegacyConfigMigratesIntoSettings
            TestCopilotLegacyConfigMergeIsShallow
            TestCopilotStartupDialsOnlyContractedHosts
            # TCL-973's directory-trust acceptance, required on BOTH arms
            # because it is what makes an unattended Copilot pane start at all:
            # the modal blocks before the provider is contacted, so a
            # regression here is every spawned agent frozen, on whichever
            # platform it regressed. These run tclaude's OWN seeder against the
            # real CLI — the Phase 0 scenarios that measured the gate itself
            # used a hand-written config and cannot cover that. The second one
            # additionally pins the migration behaviour the contract rests on
            # (trustedFolders is CLI-managed and stays in config.json), which a
            # CLI change could move out from under the seeder silently.
            TestCopilotDirTrustProductionSeedingClearsTheModal
            TestCopilotDirTrustSeedingPreservesAnInstalledTrustStore
          )
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            # The compatibility fixtures run on Linux only; see the job comment.
            required+=(
              TestCopilotVersionPin
              TestCopilotCredentialFreeTextTurn
              TestCopilotToolCallRoundTrip
              TestCopilotProviderFailure
              TestCopilotSessionEnrollmentAndResume
              TestCopilotReasoningEffortOnResponsesWire
              TestCopilotModelSelection
              TestCopilotProductionSpawnerLaunches
              TestCopilotHooksFireFromTheInstalledFile
            )
          else
            # TCL-987's acceptance proof: Copilot records a RESOLVED cwd while a
            # macOS shell hands tclaude the /var/folders/… spelling of the same
            # physical directory. The scenario skips itself where the two
            # spellings are equal, which is exactly the silent no-op this gate
            # exists to reject — on this arm it must report an explicit pass, or
            # the only platform-real evidence for the fix never ran.
            required+=(
              TestCopilotConvStoreMatchesTheUnresolvedCwdSpelling
              # TCL-973's other macOS-shaped scenario, and required here for
              # exactly the same reason: the seeder writes BOTH the spelling it
              # is handed and that path's resolved form, which is only
              # falsifiable where the two differ. It skips on Linux, so this
              # arm is the only place it is evidence rather than a no-op.
              TestCopilotDirTrustSeedingMatchesTheUnresolvedCwdSpelling
            )
          fi
          # TCL-973 Phase 0's permission matrix. Most of it is Linux-only for
          # the same reason the compatibility fixtures are: these measure
          # Copilot's own prompt behaviour, which is JavaScript in the CLI
          # rather than anything the platform decides.
          #
          # The PATH matrix is the documented exception, and it runs on BOTH
          # arms. Its subject IS platform semantics -- the cwd-subtree and
          # system-temp grants, and which spellings of them the CLI honours --
          # on a platform where TMPDIR is /var/folders/… while the resolved
          # form is /private/var/folders/…. A finding about Linux temp
          # semantics is not a finding about macOS temp semantics, so gating it
          # on Linux alone would leave the PR asserting a general
          # supported-platform contract with evidence from one platform. Note
          # that a macOS-required name must appear in BOTH the run_filter above
          # and the required list below: required-only fails loudly, which is
          # fine, but run_filter-only can skip in silence, which is not.
          #
          # This list is generated from permission_contract.json and must stay
          # equal to the set of scenarios it cites. That equality is the point:
          # the Go-side contract guard can only check that a cited scenario is
          # DECLARED, so for any scenario missing from here "declared" would be
          # the only thing standing behind a proven status. Requiring every
          # cited name is what supplies the other half.
          #
          # These names are SUBTESTS, and that changes the gate. Go indents
          # subtest result lines, so the column-anchored pattern above matches
          # only top-level tests -- and a parent whose subtests every one
          # skipped still prints "--- PASS: Parent". Gating a table-driven
          # matrix on the parent alone would verify essentially nothing.
          required_subtests=(
            'TestCopilotPermissionPathGrants/outside-all/no-path-flags'
            'TestCopilotPermissionPathGrants/outside-all/add-dir'
            'TestCopilotPermissionPathGrants/outside-all/allow-all-paths'
            'TestCopilotPermissionPathGrants/outside-all/allow-all-tools'
            # TCL-1010. Cited by yolo-permission-surface, which is what the
            # `yolo` approval token's mode help stands on, and required on BOTH
            # arms for the same reason as its siblings: it is a path finding,
            # and Linux temp/cwd semantics are not macOS temp/cwd semantics.
            'TestCopilotPermissionPathGrants/outside-all/yolo'
            'TestCopilotPermissionPathGrants/in-temp/default'
            'TestCopilotPermissionPathGrants/in-temp/disallow-temp-dir'
          )
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            required+=(
              TestCopilotPermissionContractIsBackedByScenarios
              TestCopilotPermissionFolderTrustBlocksFirst
              TestCopilotPermissionHeadlessIsNotEvidence
              TestCopilotPermissionInPaneAllowAllCannotOverrideDeny
              TestCopilotPermissionNoAskUserRemovesTheTool
              TestCopilotPermissionResumeSubmitsPrompt
              # TCL-973's web-fetch increment. These are the only scenarios in
              # the suite that run WITHOUT COPILOT_OFFLINE=true -- they have to,
              # since that variable removes web_fetch from the catalog and is
              # what made the question unaskable in Phase 0 -- so they carry the
              # egress wall (a refusing capture proxy) in place of it. A silent
              # skip here would leave the detached-spawn posture resting on an
              # unmeasured deadlock source again.
              TestCopilotPermissionWebFetchNeedsTheOnlineArm
              TestCopilotPermissionWebFetchExclusionRemovesTheTool
              # The positive control for the egress wall, and the one name here
              # whose absence would be silent: every "the proxy observed
              # nothing" assertion in that file is satisfied by a capture that
              # observed nothing BECAUSE the CLI stopped routing through it. If
              # this scenario is skipped, the online arm's containment claim is
              # unbacked while the whole matrix still reports green.
              TestCopilotPermissionWebFetchEgressWallIsInForce
              # TCL-1011's native-sandbox parents. The subtest rows below carry
              # the real evidence, and these carry the case the subtest gate
              # cannot see: a table whose rows were all RENAMED still satisfies
              # nothing, but a parent that failed to run at all is invisible to
              # a gate that only greps for rows it expects. Both halves, per
              # the same reasoning that gave this job two gates in the first
              # place.
              #
              # Linux-only, like most of the matrix above and for the same
              # reason: what they measure is the CLI's own gating, in its
              # JavaScript, not a platform boundary. They still RUN on the
              # macOS arm through that arm's run_filter, so a platform-specific
              # regression fails that job on its own.
              TestCopilotNativeSandboxSessionFlagsAreAccepted
              TestCopilotNativeSandboxSessionFlagsNeedExperimental
              TestCopilotNativeSandboxSessionFlagsDoNotPersist
              TestCopilotNativeSandboxAllowBypassDemotesEnforcementToAPrompt
              # Linux-only in the TEST as well: it reads a bubblewrap argv, and
              # the darwin backend emits a Seatbelt profile instead. Requiring
              # it on macOS would demand a PASS from a scenario that skips.
              TestCopilotNativeSandboxGeneratedLinuxPolicy
            )
            # += and NOT =. A plain assignment here would REPLACE the shared
            # array above rather than extend it, silently dropping the five
            # both-platform path rows from the Linux gate -- which is exactly
            # the regression this line shipped with once: the fix that added
            # macOS path coverage took Linux path coverage away, and both arms
            # stayed green because a gate that requires nothing passes.
            required_subtests+=(
              'TestCopilotPermissionTrustBypassSurface/allow-all-tools'
              'TestCopilotPermissionTrustBypassSurface/allow-all'
              # TCL-1010: the alias is measured under its own spelling, because
              # `yolo`'s mode help promises folder trust still blocks and a
              # documented alias has behaved differently here before
              # (COPILOT_ALLOW_ALL).
              'TestCopilotPermissionTrustBypassSurface/yolo'
              'TestCopilotPermissionTrustBypassSurface/allow-all-paths'
              'TestCopilotPermissionTrustBypassSurface/add-dir-workdir'
              'TestCopilotPermissionTrustBypassSurface/config-json-trustedFolders'
              'TestCopilotPermissionTrustBypassSurface/settings-json-trustedFolders'
              'TestCopilotPermissionToolApprovalGate/unsafe-command/no-flags'
              'TestCopilotPermissionToolApprovalGate/unsafe-command/allow-all-tools'
              # TCL-1010: --yolo on the tool gate. The `yolo` token would be a
              # posture strictly WORSE than the default it sits beside if this
              # flag did not close this gate, so it is measured rather than
              # inferred from the alias.
              'TestCopilotPermissionToolApprovalGate/unsafe-command/yolo'
              'TestCopilotPermissionToolApprovalGate/safe-command/no-flags'
              'TestCopilotPermissionDenyToolGrammar/url()'
              'TestCopilotPermissionDenyToolGrammar/shell()'
              'TestCopilotPermissionDenyToolGrammar/write()'
              'TestCopilotPermissionDenyToolGrammar/*'
              'TestCopilotPermissionDenyToolGrammar/url'
              'TestCopilotPermissionDenyToolGrammar/url(*)'
              'TestCopilotPermissionDenyToolGrammar/url(example.com)'
              'TestCopilotPermissionDenyToolGrammar/shell(*)'
              'TestCopilotPermissionDenyToolGrammar/write(/tmp)'
              'TestCopilotPermissionURLGateUnderToolApproval/no-flags'
              'TestCopilotPermissionURLGateUnderToolApproval/allow-all-tools'
              'TestCopilotPermissionAmbientAllowAllPromotes/true'
              'TestCopilotPermissionAmbientAllowAllPromotes/TRUE'
              'TestCopilotPermissionAmbientAllowAllPromotes/one'
              'TestCopilotPermissionAmbientAllowAllPromotes/false'
              'TestCopilotPermissionAmbientAllowAllPromotes/empty'
              # The web-fetch matrix. no-flags is the deadlock claim and
              # allow-all-tools/no-ask-user is the posture that closes it; a
              # gate carrying one without the other would let a blocked arm
              # stand with no positive control, or vice versa.
              'TestCopilotPermissionWebFetchGate/no-flags'
              'TestCopilotPermissionWebFetchGate/allow-all-tools'
              'TestCopilotPermissionWebFetchGate/allow-all-tools/no-ask-user'
              'TestCopilotPermissionWebFetchGate/allow-all-urls'
              'TestCopilotPermissionWebFetchGate/deny-tool-url'
              # Enforcement, per spelling. The wildcard rows are the ones that
              # must not be lost: they are what stops "parses" from being read
              # as "works" for a blanket URL deny.
              'TestCopilotPermissionWebFetchURLDenyEnforcement/deny-tool/url'
              'TestCopilotPermissionWebFetchURLDenyEnforcement/deny-tool/url(host)'
              'TestCopilotPermissionWebFetchURLDenyEnforcement/deny-url/host'
              'TestCopilotPermissionWebFetchURLDenyEnforcement/deny-tool/url(*)'
              'TestCopilotPermissionWebFetchURLDenyEnforcement/deny-url/*'
              'TestCopilotPermissionWebFetchURLDenyEnforcement/deny-url/https-star'
              # TCL-1011's native-sandbox rows. Linux-only for the same reason
              # most of the matrix above is: what they measure is the CLI's own
              # gating, in its JavaScript, not a platform boundary — the flags
              # are honoured or ignored by the same code on both hosts. They
              # still RUN on the macOS arm through the shared run_filter, so a
              # platform-specific regression fails that job on its own; what is
              # Linux-only is the anti-skip requirement.
              #
              # The exception that proves the rule is the generated-policy pair,
              # which is Linux-only in the test itself: it reads a bubblewrap
              # argv, and the darwin backend emits a Seatbelt profile instead.
              # Requiring it on macOS would demand a PASS from a scenario that
              # deliberately skips there.
              'TestCopilotNativeSandboxSessionFlagsAreAccepted/hidden-from-help'
              'TestCopilotNativeSandboxSessionFlagsAreAccepted/sandbox'
              'TestCopilotNativeSandboxSessionFlagsAreAccepted/no-sandbox'
              'TestCopilotNativeSandboxSessionFlagsAreAccepted/unknown-control'
              'TestCopilotNativeSandboxSessionFlagsNeedExperimental/enabled_no_flag'
              'TestCopilotNativeSandboxSessionFlagsNeedExperimental/disabled_no_flag'
              'TestCopilotNativeSandboxSessionFlagsNeedExperimental/enabled_experimental_only'
              'TestCopilotNativeSandboxSessionFlagsNeedExperimental/disabled_experimental_only'
              'TestCopilotNativeSandboxSessionFlagsNeedExperimental/enabled_no_sandbox_flag'
              'TestCopilotNativeSandboxSessionFlagsNeedExperimental/disabled_sandbox_flag'
              'TestCopilotNativeSandboxSessionFlagsNeedExperimental/enabled_no_sandbox_flag_experimental'
              'TestCopilotNativeSandboxSessionFlagsNeedExperimental/disabled_sandbox_flag_experimental'
              'TestCopilotNativeSandboxSessionFlagsDoNotPersist/no_sandbox_over_enabled'
              'TestCopilotNativeSandboxSessionFlagsDoNotPersist/sandbox_over_disabled'
              'TestCopilotNativeSandboxAllowBypassDemotesEnforcementToAPrompt/bypass_off'
              'TestCopilotNativeSandboxAllowBypassDemotesEnforcementToAPrompt/bypass_on'
              'TestCopilotNativeSandboxAllowBypassDemotesEnforcementToAPrompt/bypass_off_autopilot'
              'TestCopilotNativeSandboxAllowBypassDemotesEnforcementToAPrompt/bypass_on_autopilot'
              'TestCopilotNativeSandboxAllowBypassDemotesEnforcementToAPrompt/bypass_on_yolo'
              'TestCopilotNativeSandboxGeneratedLinuxPolicy/outbound_denied'
              'TestCopilotNativeSandboxGeneratedLinuxPolicy/outbound_allowed'
            )
          fi
          # The gate's own integrity check. Everything below verifies that the
          # TESTS ran; nothing yet verifies that the GATE still asks about
          # them, and a required list that quietly lost entries passes exactly
          # like one that is satisfied. These are the both-platform path
          # contract, so their presence is asserted on BOTH arms before the
          # list is used.
          for path_row in \
            'TestCopilotPermissionPathGrants/outside-all/no-path-flags' \
            'TestCopilotPermissionPathGrants/outside-all/add-dir' \
            'TestCopilotPermissionPathGrants/outside-all/allow-all-paths' \
            'TestCopilotPermissionPathGrants/outside-all/allow-all-tools' \
            'TestCopilotPermissionPathGrants/outside-all/yolo' \
            'TestCopilotPermissionPathGrants/in-temp/default' \
            'TestCopilotPermissionPathGrants/in-temp/disallow-temp-dir'
          do
            found=0
            for entry in "${required_subtests[@]}"; do
              [[ "$entry" == "$path_row" ]] && found=1 && break
            done
            if (( found == 0 )); then
              echo "::error::The anti-skip list lost '$path_row' on ${{ matrix.platform }}. The path contract is required on BOTH platforms; a branch above almost certainly assigned required_subtests with = instead of +=."
              exit 1
            fi
          done
          missing=()
          for test_name in "${required[@]}"; do
            grep -qE "^--- PASS: $test_name " "$log" || missing+=("$test_name")
          done
          for test_name in "${required_subtests[@]}"; do
            # -F: these names contain regex metacharacters on purpose —
            # `url(*)` is a Copilot deny-tool pattern, not a pattern of ours.
            grep -qF -- "--- PASS: $test_name " "$log" || missing+=("$test_name")
          done
          if (( ${#missing[@]} > 0 )); then
            {
              echo "### Copilot fixture smoke did not run"
              echo
              echo "These scenarios did not report an explicit pass:"
              printf -- '- `%s`\n' "${missing[@]}"
              echo
              echo "The job provisions pinned @github/copilot@1.0.77 and refuses a skipped or renamed test."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Copilot fixture scenarios did not report an explicit pass: ${missing[*]}"
            exit 1
          fi

      # BOTH host categories, and the second one is not optional.
      #
      # The scenarios above ran with a usable backend. The single measurement
      # that establishes TCL-977's conclusion — that Copilot's built-in file
      # edits never enter the OS sandbox — can only be made on a host where the
      # backend CANNOT start: it is the run where an edit lands while every
      # shell command fails. Requiring a usable backend everywhere (the step
      # after this one) would leave that arm dead in CI, so the decisive
      # evidence for a security capability decision would have no automated
      # coverage at all.
      #
      # Re-restricting the AppArmor knob is the same condition a hardened host
      # or a nested container presents, which is the category the arm exists to
      # describe.
      - name: Copilot sandbox smoke with the backend denied
        if: matrix.platform == 'linux'
        shell: bash
        env:
          TCLAUDE_COPILOT_FIXTURE_SMOKE: "1"
        run: |
          set -o pipefail
          # Tolerated exactly like the provisioning step's write. On a runner
          # without this knob the raw sysctl error would preempt the descriptive
          # gate below, which was written for precisely that case.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1 || true
          go test ./pkg/claude/harness/copilotfixture/... \
            -run 'TestCopilotNativeSandbox' -v -count=1 -parallel 8 -timeout 900s 2>&1 \
            | tee "$RUNNER_TEMP/copilot-fixtures-nobackend.log"

      - name: Require the backend-denied arm to have run
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          log="$RUNNER_TEMP/copilot-fixtures-nobackend.log"
          if ! grep -q 'OS sandbox backend available: false' "$log"; then
            echo "::error::The backend-denied step still reported a usable sandbox backend, so the decisive in-process-edit arm did not run. Denying unprivileged user namespaces no longer works on this runner; find another way to deny the backend rather than dropping the arm."
            exit 1
          fi
          grep -qE '^--- PASS: TestCopilotNativeSandboxBuiltinEditsAreInProcessOnly ' "$log" || {
            echo "::error::The decisive scenario did not pass in the backend-denied arm."
            exit 1
          }

      # The sandbox scenarios assert real enforcement where Copilot's OS backend
      # can start and fail-closed degradation where it cannot, so they stay green
      # either way — which is exactly why the ARM has to be checked separately.
      # A runner that silently lost its backend would keep this job green while
      # quietly stopping to test the thing the job exists for.
      - name: Require the enforcing sandbox arm
        shell: bash
        run: |
          log="$RUNNER_TEMP/copilot-fixtures.log"
          verdicts="$(grep -o 'OS sandbox backend available: [a-z]*' "$log" | sort -u || true)"
          {
            echo "### Copilot sandbox backend"
            echo
            echo '```'
            echo "${verdicts:-(no verdict logged)}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q 'OS sandbox backend available: true' "$log"; then
            echo "::error::Copilot's OS sandbox backend never started on this runner, so the native-sandbox scenarios only exercised their fail-closed arm. On Linux the provisioning step (bubblewrap + unprivileged user namespaces) has regressed; on macOS Seatbelt is expected to be present unconditionally. Note this checks the FIRST log only; the backend-denied arm has its own gate above."
            exit 1
          fi

  # The filtered-network proxy smokes build real sandboxes against live
  # fixtures. Everything that decides what runs, what counts as evidence, which
  # harness versions are pinned and how fixtures are built lives in
  # scripts/filtered-proxy-smoke/ — so extending the smokes is a repo change and
  # a review, not a workflow merge. Keep this job generic: if a change here is
  # ever needed to add a smoke, that belongs in the entrypoint instead.
  filtered-proxy-smoke:
    name: Filtered-network proxy smoke (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # One red shard must not cancel its sibling. The two halves are
      # independent evidence, and losing the other half's result to a
      # cancellation would turn one failure into two unknowns.
      fail-fast: false
      matrix:
        # The shard NAMES are the only thing this workflow knows. Which flows
        # each shard runs lives in scripts/filtered-proxy-smoke/shards.txt;
        # which harnesses each flow launches lives in the flow itself
        # (flow::harnesses), and a shard's install set is DERIVED as the union
        # of its flows' declarations. The entrypoint refuses to start unless
        # every flow in the manifest belongs to some shard — so adding a smoke
        # stays a repo change, and a flow assigned to no shard fails the run
        # instead of quietly vanishing from both jobs.
        shard: [session, agentd]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Asked of the toolchain rather than spelled out. A hardcoded
      # ~/.cache/go-build that ever stopped being GOCACHE (XDG_CACHE_HOME set in
      # the image, a setup-go change) would make the cache step below a silent
      # no-op: actions/cache warns that the path does not exist, the job stays
      # green, and the smoke quietly goes back to compiling everything cold.
      - name: Resolve the Go build cache directory
        shell: bash
        run: echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

      # The BUILD cache, keyed on this job AND ITS SHARD — the two legs compile
      # different test binaries, and one key for both would have them
      # overwriting each other's entry every run. That scoping is the whole
      # point: this job compiles large linux-tagged test binaries no other job in
      # the workflow builds, while setup-go's own entry above is keyed on go.mod
      # and the platform but NOT on the job — so it is saved by whichever job
      # finishes first, usually one that compiled none of them.
      #
      # setup-go's cache is deliberately left ON even so. It is useless for this
      # job's build output, but it is what keeps GOMODCACHE populated, since
      # every job in the workflow fills that same module entry. Turning it off
      # was tried and measured: the job then downloads the whole module graph
      # inside the smoke step, which is slower and newly able to fail on a
      # proxy.golang.org hiccup. It did, on the first run of that experiment.
      #
      # Deliberately no commit sha in the key. A hit means no save, so the entry
      # is written once per go.mod/go.sum hash instead of once per run — a
      # several-hundred-MB upload per run would exhaust the repo's 10 GB cache
      # budget in a day and cost more than the compile it saves. What the entry
      # carries is the stdlib and dependency build output, which is the bulk of
      # a cold compile and turns over only with the dependencies themselves.
      #
      # The key must stay identical across ci.yml, release.yml and
      # manual-release.yml. GitHub scopes a PR run's cache to that PR, but every
      # branch can read the default branch's — so it is release.yml's run on
      # main that populates what PR runs restore. Renaming the key in one copy
      # would silently cost most of the hit rate with no failure anywhere.
      - name: Cache Go build output
        uses: actions/cache@v6
        with:
          path: ${{ env.GOCACHE }}
          key: gobuild-filtered-proxy-smoke-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('go.sum', 'go.mod') }}
          restore-keys: |
            gobuild-filtered-proxy-smoke-${{ matrix.shard }}-${{ runner.os }}-

      # Node is needed by the entrypoint to install the pinned harnesses and to
      # read their release manifest.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # Caches the pinned Claude Code artifact. MEASURED WORTH, stated so nobody
      # mistakes this for a speedup lever: the fresh download took 2.5s on a
      # cache miss, so this saves ~2s, not the ~50MB-download cost it looks like
      # it should. It is kept because it is cheap and because it bounds the
      # damage from a slow vendor CDN, not because it moves the job's wall-clock.
      # The lever is the flow's own runtime.
      #
      # The key is the hash of lib/harnesses.sh, which is where the pins live: a
      # conservative superset, so an unrelated edit to that file costs a
      # re-download and can never serve an artifact belonging to a different
      # pin. Correctness does not rest on the key either way —
      # harnesses::install_claude verifies the published sha256 and the version
      # against whatever file it actually uses, restored or freshly downloaded.
      - name: Cache pinned harness artifacts
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/smoke-harness-cache
          key: smoke-harness-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('scripts/filtered-proxy-smoke/lib/harnesses.sh') }}

      # The shard reaches the script through env: rather than being spliced into
      # the shell line, matching the sibling test job's use of matrix values.
      # Nothing user-controlled can reach a matrix value here, so this is
      # consistency and lint-quiet rather than a live injection fix.
      - name: Run filtered-network proxy smokes
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: scripts/filtered-proxy-smoke/run.sh --shard "$SHARD"

  # The end-to-end proxy-posture smokes verify the ASSEMBLED posture: authored
  # policy in, real launch, real enforcement observed, for each posture the
  # conditional-deployment table distinguishes — including the three that must
  # deploy no proxy. Everything that decides what runs and what counts as
  # evidence lives in scripts/proxy-posture-e2e/, so extending it is a repo
  # change and a review, not a workflow merge. Keep this job generic: if a
  # change here is ever needed to add a scenario, that belongs in the entrypoint
  # instead.
  proxy-posture-e2e:
    name: Proxy posture end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run end-to-end proxy-posture smokes
        shell: bash
        run: scripts/proxy-posture-e2e/run.sh
