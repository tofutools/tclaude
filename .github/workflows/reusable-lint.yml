name: Lint

# Reusable job shared by ci.yml, release.yml and manual-release.yml. Each caller
# keeps its own gate (needs/if/permissions) on the calling job, so this file holds
# only the job body and is the single place to change it.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  # Its own job rather than steps after golangci-lint: both are cold whole-module
  # compiles (~3-4 min and ~2 min on the hosted runner), and run in sequence
  # they made lint the longest job of PR CI. A caller's `lint` job still
  # succeeds only when both jobs here do.
  vet:
    name: Vet (darwin, e2e drive)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # scripts/e2e/drive is its own module (keeps go-rod out of go.mod), so
      # the root ./... build, lint and test never compile it.
      - name: Vet e2e drive module
        run: go -C scripts/e2e/drive vet ./...

      # PR CI skips the macOS jobs unless the change is platform code; this
      # keeps a darwin compile break anywhere from passing a PR.
      - name: Type-check as darwin
        run: scripts/ci/darwin-vet.sh
