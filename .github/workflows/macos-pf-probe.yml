name: macOS PF evidence probe

# On demand only: PRs run no macOS jobs (hosted macOS runners are
# concurrency-capped; see "macOS CI" in CONTRIBUTING.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Probe scoped block, rdr, and gid matching
        run: bash scripts/macos-pf-probe.sh
