site_name: tclaude
site_url: https://tofutools.github.io/tclaude/
site_description: A self-hosted agentic dev environment — sessions, fleet operations, permissions, and sandboxing for Claude Code, Codex CLI, OpenCode, and Copilot CLI
repo_url: https://github.com/tofutools/tclaude
repo_name: tofutools/tclaude

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - content.code.copy
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Everyday use:
      - Harnesses: harnesses.md
      - Sessions: sessions.md
      - Conversations: conversations.md
      - Ask from the shell: ask.md
      - Git worktrees: worktrees.md
      - Notifications: notifications.md
  - Fleet operations:
      - Agents and groups: agents-and-groups.md
      - Spawning and lifecycle: spawning-and-lifecycle.md
      - Permissions and audit: permissions-and-audit.md
      - Teams at scale: teams-at-scale.md
      - Group routes: group-routes.md
      - Dashboard: dashboard.md
      - Operating remotely: remote.md
  - Confinement:
      - Sandboxing: sandboxing.md
      - Network filtering: network-filtering.md
      - Credential proxies: proxies.md
  - Automation:
      - Processes: processes.md
      - Task runner: tasks.md
  - Reference:
      - Utilities: utilities.md
      - Adding a harness: adding-a-harness.md
      - History: history.md
