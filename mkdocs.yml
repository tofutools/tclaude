site_name: tclaude
site_url: https://tofutools.github.io/tclaude/
site_description: A self-hosted agentic dev environment — sessions, fleet operations, permissions, and sandboxing for Claude Code, Codex CLI, OpenCode, and Copilot CLI
repo_url: https://github.com/tofutools/tclaude
repo_name: tofutools/tclaude

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - content.code.copy
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Operating guide: backend-development.md
  - Architecture: architecture.md
  - Harness capabilities: harnesses.md
  - Adding a harness: adding-a-harness.md
  - History: history.md
