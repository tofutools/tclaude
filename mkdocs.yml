site_name: tclaude
site_url: https://tofutools.github.io/tclaude/
site_description: A self-hosted agentic dev environment — sessions, fleet operations, permissions, and sandboxing for Claude Code, Codex CLI, OpenCode, Copilot CLI, Gemini CLI, and pi
repo_url: https://github.com/tofutools/tclaude
repo_name: tofutools/tclaude

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - content.code.copy
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Learn:
      - Learning path: learn/index.md
      - Get started: learn/get-started.md
      - Your first agent: learn/first-agent.md
      - Ask the Steward: learn/steward.md
      - Set up your team: learn/team-setup.md
      - Run a team through a lead: learn/team-lead.md
      - Keep agents going: learn/keep-agents-going.md
      - Work in parallel with worktrees: learn/parallel-worktrees.md
      - Link two machines: federation-setup.md
  - Dashboard:
      - Tour: dashboard.md
      - Groups: dashboard-groups.md
      - Library panel: dashboard-library.md
      - Terminals and Collab: dashboard-terminals.md
      - Companion and Steward: companion.md
      - External stewards: external-steward.md
      - Boards: boards.md
      - Messages: dashboard-messages.md
      - Automations and Plugins: dashboard-automations.md
      - Access: dashboard-access.md
      - Usage: dashboard-usage.md
      - Diagnostics: dashboard-diagnostics.md
      - Config: dashboard-config.md
      - Fleet UI: fleet-ui.md
  - Everyday use:
      - Harnesses: harnesses.md
      - Sessions: sessions.md
      - Conversations: conversations.md
      - Ask from the shell: ask.md
      - Git worktrees: worktrees.md
      - Notifications: notifications.md
  - Fleet operations:
      - Agents and groups: agents-and-groups.md
      - Spawning and lifecycle: spawning-and-lifecycle.md
      - Permissions and audit: permissions-and-audit.md
      - Teams at scale: teams-at-scale.md
      - Group routes: group-routes.md
      - Operating remotely: remote.md
      - Profiling agentd: profiling.md
      - Portable Agent Format: paf.md
      - Portable Workflow Format: pwf.md
  - Federation:
      - Overview: federation.md
      - Setup walkthrough: federation-setup.md
      - Running a hub: federation-hub.md
      - Connect and share: federation-peers.md
      - Work across nodes: federation-work.md
      - Move agents and config: federation-moving.md
      - Models and usage: federation-models.md
      - Run the fleet: federation-admin.md
      - Content boards: federation-boards.md
      - Reference: federation-reference.md
  - Confinement:
      - Sandboxing: sandboxing.md
      - Network filtering: network-filtering.md
      - Credential proxies: proxies.md
  - Automation:
      - Processes: processes.md
      - Task runner: tasks.md
  - Reference:
      - Architecture: architecture.md
      - Utilities: utilities.md
      - Usage and costs: usage-and-costs.md
      - Host status: host.md
      - Codex permission registry: codex-native-permission-registry.md
      - Server-hosted setups:
          - Running on a server: server/index.md
          - systemd: server/systemd.md
          - macOS launchd: server/launchd.md
          - Ansible: server/ansible.md
      - Adding a harness: adding-a-harness.md

extra_css:
  - stylesheets/image-viewer.css

extra_javascript:
  - javascripts/image-viewer.js

# The Go file that embeds these pages in the binary is not a page.
exclude_docs: |
  /embed.go

# Pages built but deliberately left out of the nav: a contributor runbook,
# and preliminary v2 designs that are not user guidance.
not_in_nav: |
  /e2e-manual-verification.md
  /v2-plan-and-ideas/

# `mkdocs build --strict` (docs-check workflow) fails on any of these.
validation:
  omitted_files: info
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
